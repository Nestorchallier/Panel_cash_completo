<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Próximo Crédito</title>
<style>
  :root{
    --ink:#e7edf7;
    --paper:#0a0e14;
    --panel:#111826;
    --input-bg:#0d141f;
    --line:#212c40;
    --slate:#b7c3d6;
    --muted:#8996ab;
    --accent:#3fd0c9;
    --accent-soft:rgba(63,208,201,.14);
    --on-accent:#04121a;
    --warn:#f0b866;
    --warn-soft:rgba(240,184,102,.16);
    --danger:#e8677c;
    --danger-soft:rgba(232,103,124,.14);
    font-family: 'Iowan Old Style', 'Georgia', serif;
  }
  :root[data-theme="light"]{
    --ink:#1b2430;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --input-bg:#fdfcf9;
    --line:#dcd6c8;
    --slate:#4c5a67;
    --muted:#8b8577;
    --accent:#0f6b5c;
    --accent-soft:#e4f0ec;
    --on-accent:#ffffff;
    --warn:#a8631d;
    --warn-soft:#fbeee1;
    --danger:#a13d3d;
    --danger-soft:#f8e9e9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding:32px 16px 64px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-family:'Georgia', 'Iowan Old Style', serif;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0;
    font-weight:600;
  }
  header .tag{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:720px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:24px;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--slate);
    margin:0 0 18px;
    font-weight:700;
  }
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
    color:var(--ink);
  }
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  input[type=number]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:15px;
    background:var(--input-bg);
    color:var(--ink);
  }
  input[type=number]:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .segmented{
    display:flex;
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .segmented button{
    flex:1;
    padding:10px 6px;
    background:#fdfcf9;
    border:none;
    border-right:1px solid var(--line);
    font-size:13px;
    font-weight:600;
    color:var(--slate);
    cursor:pointer;
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{
    background:var(--accent);
    color:var(--on-accent);
  }

  .result-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    margin-top:20px;
    padding:28px;
  }
  .result-panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--slate);
    margin:0 0 18px;
    font-weight:700;
  }
  .status-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .dot.ok{background:var(--accent);}
  .dot.review{background:var(--warn);}
  .dot.no{background:var(--danger);}
  .status-label{font-size:14px;font-weight:700;letter-spacing:0.3px;}
  .status-label.ok{color:var(--accent);}
  .status-label.review{color:var(--warn);}
  .status-label.no{color:var(--danger);}

  .amount-display{
    font-family:'Georgia', serif;
    font-size:38px;
    font-weight:700;
    margin:6px 0 4px;
  }
  .amount-sub{font-size:13px;color:var(--muted);margin-bottom:18px;}

  .note-box{
    border-left:3px solid;
    padding:12px 16px;
    font-size:13.5px;
    line-height:1.5;
    border-radius:0 3px 3px 0;
  }
  .note-box.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .note-box.review{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);}
  .note-box.no{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}

  .breakdown{
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    flex-wrap:wrap;
    gap:6px 18px;
  }
  .breakdown b{color:var(--slate);}

  footer{
    margin-top:28px;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Calculadora de Próximo Crédito</h1>
    <div class="tag">CRM Panel Unificado · Gestión de Cobranzas</div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>1. Créditos históricos</h2>
      <div class="field">
        <div class="segmented" id="creditGroup">
          <button data-val="1" class="active">1 crédito</button>
          <button data-val="2">2 y 3 créditos</button>
          <button data-val="4">4 o más</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>2. Datos del cliente</h2>
      <div class="field">
        <label for="monto">Monto de la última renovación ($)</label>
        <input type="number" id="monto" placeholder="Ej: 320000" min="0" step="1000">
      </div>
      <div class="field">
        <label for="dias">Días de atraso</label>
        <input type="number" id="dias" placeholder="Ej: 15" min="0" step="1">
      </div>
    </div>
  </div>

  <div class="result-panel" id="resultPanel">
    <h2>Resultado</h2>
    <div id="resultContent">
      <div class="hint">Completá el monto y los días de atraso para ver el resultado.</div>
    </div>
  </div>

  <footer>Los valores se calculan tomando la fila igual o superior más cercana en la tabla de referencia.</footer>
</div>

<!-- La tabla y las reglas viven en js/proximo-credito.js: las fichas del
     cliente usan exactamente el mismo cálculo. -->
<script src="js/proximo-credito.js?v=39"></script>
<script>
let selectedGroup = "1";

document.querySelectorAll('#creditGroup button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#creditGroup button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedGroup = btn.dataset.val;
    compute();
  });
});

document.getElementById('monto').addEventListener('input', compute);
document.getElementById('dias').addEventListener('input', compute);

function fmt(n){
  return '$ ' + Number(n).toLocaleString('es-AR');
}

function render(status, title, amountHtml, subText, noteText, breakdownHtml){
  const panel = document.getElementById('resultContent');
  panel.innerHTML = `
    <div class="status-row">
      <div class="dot ${status}"></div>
      <div class="status-label ${status}">${title}</div>
    </div>
    ${amountHtml ? `<div class="amount-display">${amountHtml}</div>` : ''}
    ${subText ? `<div class="amount-sub">${subText}</div>` : ''}
    <div class="note-box ${status}">${noteText}</div>
    ${breakdownHtml ? `<div class="breakdown">${breakdownHtml}</div>` : ''}
  `;
}

function compute(){
  const montoInput = document.getElementById('monto').value;
  const diasInput = document.getElementById('dias').value;

  if(montoInput === '' || diasInput === ''){
    document.getElementById('resultContent').innerHTML =
      '<div class="hint">Completá el monto y los días de atraso para ver el resultado.</div>';
    return;
  }

  const monto = Number(montoInput);
  const dias = Number(diasInput);

  // El cálculo es el de js/proximo-credito.js; acá solo se arman los textos.
  const r = CMProximoCredito.calcular(selectedGroup, monto, dias);
  const groupLabel = CMProximoCredito.NOMBRE_GRUPO[r.grupo];

  const breakdown = `<span><b>Grupo:</b> ${groupLabel}</span><span><b>Tramo de monto usado:</b> ${r.tramo ? fmt(r.tramo) : '—'}</span><span><b>Días de atraso:</b> ${dias}</span>`;

  if(r.estado === 'sin_datos'){
    render('review', 'Requiere análisis manual', '', '',
      'Ingresá un monto mayor a $ 0 para buscar el tramo en la tabla.', breakdown);
    return;
  }

  if(r.banda === 'excedido'){
    render('review', 'Requiere análisis manual',
      '', '',
      `El monto ingresado (${fmt(monto)}) supera el tramo máximo cargado en la tabla (${fmt(r.tramo)}). No hay un valor automático definido para este caso; debe evaluarse manualmente.`,
      breakdown);
    return;
  }

  // Banda 1: menor a 20 días -> plan recibo (min = tramo, max = columna 2)
  if(r.banda === 'recibo'){
    render('ok', 'Aprobado · Plan Recibo',
      `${fmt(r.desde)} — ${fmt(r.monto)}`,
      'Rango entre el mínimo y el máximo del plan de recibo',
      `El cliente puede renovar por un monto dentro de este rango, según el plan de recibo definido para este tramo.`,
      breakdown);
    return;
  }

  if(r.estado === 'ok'){
    render('ok', 'Aprobado', fmt(r.monto), '',
      'Monto habilitado para este tramo de monto y días de atraso.', breakdown);
    return;
  }

  if(r.estado === 'no'){
    render('no', 'No aprobado', fmt(0), '',
      'Con 1 crédito histórico y 55 días de atraso o más, no corresponde renovación automática.',
      breakdown);
    return;
  }

  // Análisis manual: el texto depende del grupo y la banda.
  let nota;
  if(r.grupo === '1') nota = `Con 1 crédito histórico y entre ${r.banda === '20-39' ? '20 y 39' : '40 y 54'} días de atraso, la renovación no es automática y debe pasar a análisis.`;
  else if(r.grupo === '2') nota = 'Con 2 o 3 créditos históricos y 55 días de atraso o más, la renovación no es automática y debe pasar a análisis.';
  else nota = 'Con 4 créditos o más y 60 días de atraso o más, la renovación no es automática y debe pasar a análisis.';
  render('review', 'Requiere análisis manual', '', '', nota, breakdown);
}

// Modo claro/oscuro: lo controla el panel principal (el mismo interruptor
// que usa el Kanban), nos avisa por postMessage cuando cambia.
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
}
window.addEventListener('message', e=>{
  if(e.data && e.data.type === 'cm-theme') applyTheme(e.data.theme);
});
</script>
</body>
</html>
