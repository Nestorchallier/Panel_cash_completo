<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Próximo Crédito</title>
<style>
  :root{
    --ink:#e7edf7;
    --paper:#0a0e14;
    --panel:#111826;
    --line:#212c40;
    --slate:#b7c3d6;
    --muted:#8996ab;
    --accent:#3fd0c9;
    --accent-soft:rgba(63,208,201,.14);
    --warn:#f0b866;
    --warn-soft:rgba(240,184,102,.16);
    --danger:#e8677c;
    --danger-soft:rgba(232,103,124,.14);
    font-family: 'Iowan Old Style', 'Georgia', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding:32px 16px 64px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-family:'Georgia', 'Iowan Old Style', serif;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0;
    font-weight:600;
  }
  header .tag{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:720px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:24px;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--slate);
    margin:0 0 18px;
    font-weight:700;
  }
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
    color:var(--ink);
  }
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  input[type=number]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:15px;
    background:#fdfcf9;
    color:var(--ink);
  }
  input[type=number]:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .segmented{
    display:flex;
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .segmented button{
    flex:1;
    padding:10px 6px;
    background:#fdfcf9;
    border:none;
    border-right:1px solid var(--line);
    font-size:13px;
    font-weight:600;
    color:var(--slate);
    cursor:pointer;
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{
    background:var(--accent);
    color:#04121a;
  }

  .result-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    margin-top:20px;
    padding:28px;
  }
  .result-panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--slate);
    margin:0 0 18px;
    font-weight:700;
  }
  .status-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .dot.ok{background:var(--accent);}
  .dot.review{background:var(--warn);}
  .dot.no{background:var(--danger);}
  .status-label{font-size:14px;font-weight:700;letter-spacing:0.3px;}
  .status-label.ok{color:var(--accent);}
  .status-label.review{color:var(--warn);}
  .status-label.no{color:var(--danger);}

  .amount-display{
    font-family:'Georgia', serif;
    font-size:38px;
    font-weight:700;
    margin:6px 0 4px;
  }
  .amount-sub{font-size:13px;color:var(--muted);margin-bottom:18px;}

  .note-box{
    border-left:3px solid;
    padding:12px 16px;
    font-size:13.5px;
    line-height:1.5;
    border-radius:0 3px 3px 0;
  }
  .note-box.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .note-box.review{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);}
  .note-box.no{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}

  .breakdown{
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    flex-wrap:wrap;
    gap:6px 18px;
  }
  .breakdown b{color:var(--slate);}

  footer{
    margin-top:28px;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Calculadora de Próximo Crédito</h1>
    <div class="tag">Cash Market · Gestión de Cobranzas</div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>1. Créditos históricos</h2>
      <div class="field">
        <div class="segmented" id="creditGroup">
          <button data-val="1" class="active">1 crédito</button>
          <button data-val="2">2 y 3 créditos</button>
          <button data-val="4">4 o más</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>2. Datos del cliente</h2>
      <div class="field">
        <label for="monto">Monto de la última renovación ($)</label>
        <input type="number" id="monto" placeholder="Ej: 320000" min="0" step="1000">
      </div>
      <div class="field">
        <label for="dias">Días de atraso</label>
        <input type="number" id="dias" placeholder="Ej: 15" min="0" step="1">
      </div>
    </div>
  </div>

  <div class="result-panel" id="resultPanel">
    <h2>Resultado</h2>
    <div id="resultContent">
      <div class="hint">Completá el monto y los días de atraso para ver el resultado.</div>
    </div>
  </div>

  <footer>Los valores se calculan tomando la fila igual o superior más cercana en la tabla de referencia.</footer>
</div>

<script>
// ---- Tablas extraídas de la matriz de renovación ----
// Cada fila: [montoUltimaRenovacion (bucket), maxPlanRecibo(<20 dias), valor(<40 dias), valor(banda3)]
// Para grupo 1: valor(<40) y valor(banda3) son siempre "Analisis"; banda4 (>55) siempre $0.
// Para grupo 2y3: banda3 = "40 a 55", banda4 (>55) siempre "Analisis".
// Para grupo 4omas: banda3 = "40 a 60", banda4 (>60) siempre "Analisis".

const group1 = [
  [160000,260000],[180000,280000],[200000,300000],[220000,320000],
  [240000,340000],[260000,360000],[280000,380000],[300000,400000]
];

const group2y3 = [
  [160000,360000,160000,160000],[180000,420000,160000,160000],[200000,440000,160000,160000],
  [220000,460000,160000,160000],[240000,480000,160000,160000],[260000,500000,160000,160000],
  [280000,540000,180000,160000],[300000,560000,180000,160000],[320000,580000,200000,160000],
  [340000,600000,200000,160000],[360000,640000,220000,160000],[380000,660000,220000,180000],
  [400000,680000,240000,180000],[420000,700000,260000,180000],[440000,720000,260000,200000],
  [460000,740000,280000,200000],[480000,760000,280000,220000],[500000,800000,300000,220000],
  [520000,800000,320000,240000],[540000,800000,320000,240000],[560000,800000,340000,260000],
  [580000,800000,340000,260000],[600000,800000,360000,260000],[620000,800000,380000,280000],
  [640000,800000,380000,280000],[660000,800000,400000,300000],[680000,800000,400000,300000],
  [700000,800000,420000,320000],[720000,800000,440000,320000],[740000,800000,440000,340000],
  [760000,800000,460000,340000],[780000,800000,460000,360000],[800000,800000,480000,360000]
];

const group4omas = [
  [160000,460000,160000,160000],[180000,480000,160000,160000],[200000,500000,180000,160000],
  [220000,520000,200000,160000],[240000,560000,200000,180000],[260000,580000,220000,200000],
  [280000,620000,240000,200000],[300000,640000,260000,220000],[320000,680000,280000,240000],
  [340000,720000,280000,260000],[360000,740000,300000,260000],[380000,780000,320000,280000],
  [400000,800000,340000,300000],[420000,800000,360000,300000],[440000,800000,360000,320000],
  [460000,800000,380000,340000],[480000,800000,400000,340000],[500000,800000,420000,360000],
  [520000,800000,440000,380000],[540000,800000,440000,400000],[560000,800000,460000,400000],
  [580000,800000,480000,420000],[600000,800000,500000,440000],[620000,800000,520000,440000],
  [640000,800000,520000,460000],[660000,800000,540000,480000],[680000,800000,560000,480000],
  [700000,800000,560000,480000],[720000,800000,440000,320000],[740000,800000,440000,340000],
  [760000,800000,460000,340000],[780000,800000,460000,360000],[800000,800000,480000,360000]
];

let selectedGroup = "1";

document.querySelectorAll('#creditGroup button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#creditGroup button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedGroup = btn.dataset.val;
    compute();
  });
});

document.getElementById('monto').addEventListener('input', compute);
document.getElementById('dias').addEventListener('input', compute);

function fmt(n){
  return '$ ' + Number(n).toLocaleString('es-AR');
}

function findRow(table, monto){
  // toma la fila igual o superior más cercana (redondeo hacia arriba)
  for(const row of table){
    if(monto <= row[0]) return {row, exceeded:false};
  }
  return {row: table[table.length-1], exceeded:true};
}

function render(status, title, amountHtml, subText, noteText, breakdownHtml){
  const panel = document.getElementById('resultContent');
  panel.innerHTML = `
    <div class="status-row">
      <div class="dot ${status}"></div>
      <div class="status-label ${status}">${title}</div>
    </div>
    ${amountHtml ? `<div class="amount-display">${amountHtml}</div>` : ''}
    ${subText ? `<div class="amount-sub">${subText}</div>` : ''}
    <div class="note-box ${status}">${noteText}</div>
    ${breakdownHtml ? `<div class="breakdown">${breakdownHtml}</div>` : ''}
  `;
}

function compute(){
  const montoInput = document.getElementById('monto').value;
  const diasInput = document.getElementById('dias').value;

  if(montoInput === '' || diasInput === ''){
    document.getElementById('resultContent').innerHTML =
      '<div class="hint">Completá el monto y los días de atraso para ver el resultado.</div>';
    return;
  }

  const monto = Number(montoInput);
  const dias = Number(diasInput);

  let table, groupLabel;
  if(selectedGroup === "1"){ table = group1; groupLabel = "1 crédito"; }
  else if(selectedGroup === "2"){ table = group2y3; groupLabel = "2 y 3 créditos"; }
  else { table = group4omas; groupLabel = "4 o más créditos"; }

  const {row, exceeded} = findRow(table, monto);
  const bucket = row[0];

  const breakdown = `<span><b>Grupo:</b> ${groupLabel}</span><span><b>Tramo de monto usado:</b> ${fmt(bucket)}</span><span><b>Días de atraso:</b> ${dias}</span>`;

  if(exceeded){
    render('review', 'Requiere análisis manual',
      '', '',
      `El monto ingresado (${fmt(monto)}) supera el tramo máximo cargado en la tabla (${fmt(bucket)}). No hay un valor automático definido para este caso; debe evaluarse manualmente.`,
      breakdown);
    return;
  }

  // Banda 1: menor a 20 días -> plan recibo (min = bucket, max = row[1])
  if(dias < 20){
    render('ok', 'Aprobado · Plan Recibo',
      `${fmt(bucket)} — ${fmt(row[1])}`,
      'Rango entre el mínimo y el máximo del plan de recibo',
      `El cliente puede renovar por un monto dentro de este rango, según el plan de recibo definido para este tramo.`,
      breakdown);
    return;
  }

  if(selectedGroup === "1"){
    // grupo 1 crédito: 20-40 Analisis, 40-55 Analisis, >55 = $0
    if(dias < 40){
      render('review', 'Requiere análisis manual', '', '',
        'Con 1 crédito histórico y entre 20 y 39 días de atraso, la renovación no es automática y debe pasar a análisis.',
        breakdown);
    } else if(dias < 55){
      render('review', 'Requiere análisis manual', '', '',
        'Con 1 crédito histórico y entre 40 y 54 días de atraso, la renovación no es automática y debe pasar a análisis.',
        breakdown);
    } else {
      render('no', 'No aprobado', fmt(0), '',
        'Con 1 crédito histórico y 55 días de atraso o más, no corresponde renovación automática.',
        breakdown);
    }
    return;
  }

  if(selectedGroup === "2"){
    // grupo 2y3: 20-40 -> row[2], 40-55 -> row[3], >55 -> Analisis
    if(dias < 40){
      render('ok', 'Aprobado', fmt(row[2]), '',
        'Monto habilitado para este tramo de monto y días de atraso.', breakdown);
    } else if(dias < 55){
      render('ok', 'Aprobado', fmt(row[3]), '',
        'Monto habilitado para este tramo de monto y días de atraso.', breakdown);
    } else {
      render('review', 'Requiere análisis manual', '', '',
        'Con 2 o 3 créditos históricos y 55 días de atraso o más, la renovación no es automática y debe pasar a análisis.',
        breakdown);
    }
    return;
  }

  // grupo 4 o más: 20-40 -> row[2], 40-60 -> row[3], >60 -> Analisis
  if(dias < 40){
    render('ok', 'Aprobado', fmt(row[2]), '',
      'Monto habilitado para este tramo de monto y días de atraso.', breakdown);
  } else if(dias < 60){
    render('ok', 'Aprobado', fmt(row[3]), '',
      'Monto habilitado para este tramo de monto y días de atraso.', breakdown);
  } else {
    render('review', 'Requiere análisis manual', '', '',
      'Con 4 créditos o más y 60 días de atraso o más, la renovación no es automática y debe pasar a análisis.',
      breakdown);
  }
}
</script>
</body>
</html>
