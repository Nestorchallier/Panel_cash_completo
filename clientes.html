<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes — Cash Market</title>
<script src="js/embed-guard.js"></script>
<link rel="stylesheet" href="css/fuentes.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="supabase/kv.js"></script>
<script src="js/telefonos.js"></script>
<!-- mora.js antes de crm.js: crmGetFichaCliente lo usa para recalcular las
     cuotas y el atraso al día de hoy. -->
<script src="js/mora.js"></script>
<script src="supabase/crm.js"></script>
<style>
  /* Paleta del plan (render 5.3): claro por defecto, oscuro opcional. */
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel-2:#f8fafc; --line:#e2e8f0; --line-2:#f1f5f9;
    --text:#0f172a; --text-2:#334155; --muted:#64748b; --faint:#94a3b8;
    --blue:#2563eb; --green:#16a34a; --green-hover:#15803d; --red:#b91c1c; --amber:#b45309;
    --img-bg:#eff6ff; --img-line:#dbeafe;
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --panel:#0f172a; --panel-2:#111c33; --line:#1e293b; --line-2:#162036;
    --text:#e2e8f0; --text-2:#cbd5e1; --muted:#94a3b8; --faint:#64748b;
    --blue:#60a5fa; --green:#22c55e; --green-hover:#22c55e; --red:#f87171; --amber:#fbbf24;
    --img-bg:#13213d; --img-line:#1e3a8a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}

  header{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel);}
  .head-izq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .header-sub{font-size:13px;color:var(--muted);}
  .miga{font-size:14px;color:var(--muted);background:none;border:none;padding:0;}
  .miga:hover{color:var(--blue);}
  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:300px;}
  .search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
  .btn:hover{border-color:var(--faint);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn-verde{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-verde:hover{background:var(--green-hover);}
  .btn-azul{background:var(--blue);border-color:var(--blue);color:#fff;}

  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;background:#f1f5f9;color:#475569;display:inline-flex;align-items:center;gap:3px;}
  .tag.verde{background:#dcfce7;color:#15803d;} .tag.rojo{background:#fee2e2;color:#b91c1c;}
  .tag.ambar{background:#fef3c7;color:#b45309;} .tag.violeta{background:#ede9fe;color:#6d28d9;}
  .tag.azul{background:#dbeafe;color:#1d4ed8;} .tag.cian{background:#cffafe;color:#0e7490;} .tag.gris{background:#f1f5f9;color:#475569;}

  main{padding:18px 22px;}
  /* ---- Lista ---- */
  .lista-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  tr.row-cliente{cursor:pointer;}
  tr.row-cliente:hover td{background:var(--panel-2);}
  .nombre-celda{display:flex;align-items:center;gap:10px;font-weight:700;}
  .nombre-celda .avatar{width:30px;height:30px;font-size:11px;}
  .rojo-txt{color:var(--red);font-weight:700;}
  .gris-txt{color:var(--faint);}

  /* ---- Ficha ---- */
  #vistaFicha{display:none;}
  /* Proporciones del render 5.3: datos a la izquierda, números y cuotas en
     el centro (la columna más ancha), historial a la derecha. */
  .ficha-grid{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.45fr) minmax(290px,1fr);gap:18px;align-items:start;}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .card-titulo{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .card-link{font-size:13px;font-weight:700;color:var(--blue);background:none;border:none;padding:0;}
  .card-derecha{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .fila{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;align-items:center;}
  .fila .k{color:var(--muted);white-space:nowrap;}
  .fila .v{font-weight:600;text-align:right;overflow-wrap:anywhere;color:var(--text);}
  .fila .v .tag{margin-left:4px;}

  .indicadores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .indicador{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;}
  .indicador .label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.35;}
  .indicador .valor{font-size:25px;font-weight:800;margin-top:5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .indicador .valor.rojo{color:var(--red);} .indicador .valor.verde{color:var(--green-hover);} .indicador .valor.ambar{color:var(--amber);}
  .indicador .sub{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.3;}
  .indicador.clic{cursor:pointer;}
  .indicador.clic:hover{border-color:var(--faint);}

  .tabla{width:100%;}
  .tabla th{background:var(--panel-2);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);}
  .tabla td{font-size:13.5px;padding:10px 10px;border-bottom:1px solid var(--line);}
  .tabla tr:last-child td{border-bottom:1px solid var(--line);}
  .tabla .num b{font-weight:700;}
  .tabla .tag{margin-right:4px;}
  .empty-state{color:var(--muted);font-size:13px;padding:24px;text-align:center;}

  /* Historial de gestión: una línea vertical une los puntos de color. */
  .card-historial{display:flex;flex-direction:column;position:sticky;top:18px;height:calc(100vh - 36px - 70px);min-height:420px;}
  .filtros-cli{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;}
.filtros-cli select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;cursor:pointer;}
.filtro-wrap{position:relative;}
  .filtro-btn{font-size:13px;font-weight:700;color:var(--blue);background:none;border:none;padding:0;}
  .filtro-menu{position:absolute;right:0;top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:5px;z-index:10;min-width:140px;display:none;}
  .filtro-menu.abierto{display:block;}
  .filtro-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--text-2);}
  .filtro-menu button:hover{background:var(--panel-2);}
  .filtro-menu button.activo{color:var(--blue);font-weight:700;}
  .timeline{flex:1;overflow-y:auto;padding-right:4px;margin-right:-4px;}
  .tl-item{position:relative;padding:0 0 16px 22px;}
  .tl-item::before{content:'';position:absolute;left:5px;top:10px;bottom:-6px;width:2px;background:var(--line);}
  .tl-item:last-child{padding-bottom:4px;}
  .tl-item:last-child::before{bottom:-2px;}
  .tl-dot{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);}
  .tl-titulo{font-size:13.5px;color:var(--text);line-height:1.35;}
  .tl-titulo b{font-weight:700;}
  .tl-cuando{font-size:12px;color:var(--faint);margin-top:1px;}
  .tl-texto{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;margin-top:6px;font-size:13px;color:var(--text-2);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;}
  .tl-media{display:flex;align-items:center;justify-content:center;gap:4px;width:68px;height:48px;margin-top:8px;border-radius:8px;background:var(--img-bg);border:1px solid var(--img-line);font-size:10.5px;color:var(--muted);overflow:hidden;text-decoration:none;}
  .tl-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .tl-vacio{color:var(--muted);font-size:13px;padding:24px 4px;text-align:center;}
  .nota-box{display:flex;gap:8px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);}
  .nota-box input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;}
  .nota-box input:focus{border-color:var(--blue);}
  .nota-box .btn-azul{padding:8px 16px;}

  @media (max-width:1250px){
    .ficha-grid{grid-template-columns:minmax(240px,280px) minmax(0,1fr);}
    .ficha-grid > .col:last-child{grid-column:1 / -1;}
    .card-historial{position:static;height:auto;}
    .timeline{max-height:520px;}
    .indicadores{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:800px){ .ficha-grid{grid-template-columns:1fr;} .search{width:100%;} }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#334155;}
</style>
</head>
<body>

<header>
  <div class="head-izq" id="headIzq">
    <h1>👥 Clientes</h1>
    <span class="header-sub" id="headerSub"></span>
  </div>
  <div id="headDer">
    <div class="search" id="searchWrap">
      <span>🔍</span>
      <input type="text" id="buscarCliente" placeholder="Buscar por nombre, DNI o préstamo...">
    </div>
  </div>
</header>

<main>
  <div id="vistaLista">
    <div class="filtros-cli">
      <select id="fEtapa"><option value="">Etapa: Todas</option></select>
      <select id="fTramo"><option value="">Tramo mora: Todos</option></select>
      <select id="fEstado">
        <option value="">Préstamo: Todos</option>
        <option value="activo">Con préstamo activo</option>
        <option value="atraso">Con atraso</option>
        <option value="cancelado">Cancelados</option>
        <option value="sin">Sin préstamo</option>
      </select>
      <select id="fOrden">
        <option value="nombre">Orden: Nombre</option>
        <option value="dias">Orden: Más días de atraso</option>
        <option value="saldo">Orden: Mayor saldo vencido</option>
      </select>
      <button id="fLimpiar" class="filtro-btn" style="display:none;">✕ Limpiar filtros</button>
      <span class="gris-txt" id="fCuenta"></span>
    </div>
    <div class="lista-card">
      <table>
        <thead><tr><th>Cliente</th><th>DNI</th><th>Etapa</th><th>Tramo</th><th>Saldo vencido</th><th>Días de atraso</th><th>Teléfono</th></tr></thead>
        <tbody id="tablaClientes"></tbody>
      </table>
    </div>
  </div>

  <div id="vistaFicha"></div>
</main>

<script>
let clientesCache = [];
let etapasCache = [];
let fichaActual = null;
let timelineActual = [];
let filtroTimeline = 'todo';
let nombreUsuario = '';

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$' + Math.round(Number(n)||0).toLocaleString('es-AR'); }
function fmtFecha(iso, corto){
  if(!iso) return '—';
  const [y,m,d] = String(iso).slice(0,10).split('-');
  return corto ? `${d}/${m}` : `${d}/${m}/${y}`;
}
function fmtMesAnio(iso){ if(!iso) return '—'; const [y,m] = String(iso).slice(0,10).split('-'); return `${m}/${y}`; }
function fmtDni(dni){ const d = String(dni||'').replace(/\D/g,''); return d.length >= 7 ? Number(d).toLocaleString('es-AR') : (dni || '—'); }
// El Excel trae el CUIL pegado (27321456784); en la ficha va con guiones.
function fmtCuil(c){ const d = String(c||'').replace(/\D/g,''); return d.length === 11 ? `${d.slice(0,2)}-${d.slice(2,10)}-${d.slice(10)}` : (c || ''); }
function iniciales(nombre){ return window.crmIniciales ? crmIniciales(nombre) : String(nombre||'?').slice(0,2).toUpperCase(); }
function nombreCorto(nombre){ return (window.crmNombreCorto && crmNombreCorto(nombre)) || nombre || ''; }
function hoy(){ return window.CMMora ? CMMora.hoyISO() : new Date().toISOString().slice(0,10); }
const AVATAR_PALETTE = ['#db2777','#0891b2','#7c3aed','#ea580c','#16a34a','#dc2626','#ca8a04','#2563eb'];
function colorParaNombre(nombre){
  let hash = 0; const s = String(nombre||'');
  for(let i=0;i<s.length;i++) hash = (hash*31 + s.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(hash)];
}
const CLS_ETAPA = { a_contactar:'gris', contactado:'azul', promesa:'ambar', verificar_pago:'violeta', refinanciado:'cian', cerrado:'verde' };
function etapaDe(clave){ return etapasCache.find(x => x.id === clave || x._rowId === clave) || null; }
function tagEtapa(clave){
  const e = etapaDe(clave);
  return e ? `<span class="tag ${CLS_ETAPA[e.id] || 'gris'}">${escapeHtml(e.name)}</span>` : '';
}
function tieneEtiqueta(etiquetas, nombre){ return (etiquetas || []).some(e => String(e).toLowerCase() === nombre); }
function telFmt(t){ return (window.formatearTelefonoAR && window.formatearTelefonoAR(window.normalizarTelefonoAR ? (window.normalizarTelefonoAR(t) || t) : t)) || t; }
function irAVista(view){ window.top.postMessage({ type:'cm-ir-a-vista', view }, '*'); }

// Tramo de mora con el color del filtro del Kanban (5.2).
const CLS_TRAMO = { al_dia:'verde', '1_30':'ambar', '31_60':'rojo', '61_90':'rojo', mas_90:'rojo' };
function tramoInfo(dias){
  const id = window.CMMora ? CMMora.tramoMora(dias) : (dias > 0 ? '1_30' : 'al_dia');
  const t = (window.CMMora ? CMMora.TRAMOS_MORA : []).find(x => x.id === id);
  return { id, nombre: t ? t.nombre : id, cls: CLS_TRAMO[id] || 'gris' };
}

/* ================= Próximo crédito =================
   Misma tabla y mismas reglas que la Calculadora (calculadora_proximo_credito.html):
   se busca la fila de la tabla igual o superior más cercana al monto del
   último crédito, dentro del grupo según cuántos créditos tuvo el cliente,
   y el resultado depende de los días de atraso:
     - menos de 20 días: "Plan Recibo" (rango entre el tramo y el máximo);
     - 1 crédito: 20 a 54 días -> análisis manual; 55 o más -> $0;
     - 2 y 3 créditos: 20-39 -> columna 3; 40-54 -> columna 4; 55+ -> análisis;
     - 4 o más: 20-39 -> columna 3; 40-59 -> columna 4; 60+ -> análisis;
     - monto por encima de la tabla -> análisis manual.
   Si se cambia la tabla en la Calculadora, hay que cambiarla acá también. */
const PC_GRUPO_1 = [
  [160000,260000],[180000,280000],[200000,300000],[220000,320000],
  [240000,340000],[260000,360000],[280000,380000],[300000,400000]
];
const PC_GRUPO_2Y3 = [
  [160000,360000,160000,160000],[180000,420000,160000,160000],[200000,440000,160000,160000],
  [220000,460000,160000,160000],[240000,480000,160000,160000],[260000,500000,160000,160000],
  [280000,540000,180000,160000],[300000,560000,180000,160000],[320000,580000,200000,160000],
  [340000,600000,200000,160000],[360000,640000,220000,160000],[380000,660000,220000,180000],
  [400000,680000,240000,180000],[420000,700000,260000,180000],[440000,720000,260000,200000],
  [460000,740000,280000,200000],[480000,760000,280000,220000],[500000,800000,300000,220000],
  [520000,800000,320000,240000],[540000,800000,320000,240000],[560000,800000,340000,260000],
  [580000,800000,340000,260000],[600000,800000,360000,260000],[620000,800000,380000,280000],
  [640000,800000,380000,280000],[660000,800000,400000,300000],[680000,800000,400000,300000],
  [700000,800000,420000,320000],[720000,800000,440000,320000],[740000,800000,440000,340000],
  [760000,800000,460000,340000],[780000,800000,460000,360000],[800000,800000,480000,360000]
];
const PC_GRUPO_4OMAS = [
  [160000,460000,160000,160000],[180000,480000,160000,160000],[200000,500000,180000,160000],
  [220000,520000,200000,160000],[240000,560000,200000,180000],[260000,580000,220000,200000],
  [280000,620000,240000,200000],[300000,640000,260000,220000],[320000,680000,280000,240000],
  [340000,720000,280000,260000],[360000,740000,300000,260000],[380000,780000,320000,280000],
  [400000,800000,340000,300000],[420000,800000,360000,300000],[440000,800000,360000,320000],
  [460000,800000,380000,340000],[480000,800000,400000,340000],[500000,800000,420000,360000],
  [520000,800000,440000,380000],[540000,800000,440000,400000],[560000,800000,460000,400000],
  [580000,800000,480000,420000],[600000,800000,500000,440000],[620000,800000,520000,440000],
  [640000,800000,520000,460000],[660000,800000,540000,480000],[680000,800000,560000,480000],
  [700000,800000,560000,480000],[720000,800000,440000,320000],[740000,800000,440000,340000],
  [760000,800000,460000,340000],[780000,800000,460000,360000],[800000,800000,480000,360000]
];
// -> { estado: 'ok'|'revision'|'no'|'sin_datos', monto, desde, motivo }
function calcularProximoCredito(cantCreditos, montoUltimo, dias){
  const monto = Number(montoUltimo) || 0;
  const d = Math.max(0, Number(dias) || 0);
  const grupo = cantCreditos >= 4 ? '4' : cantCreditos >= 2 ? '2' : '1';
  if(monto <= 0) return { estado:'sin_datos', grupo, motivo:'Falta el monto del último crédito' };
  const tabla = grupo === '1' ? PC_GRUPO_1 : grupo === '2' ? PC_GRUPO_2Y3 : PC_GRUPO_4OMAS;
  const fila = tabla.find(r => monto <= r[0]);
  if(!fila) return { estado:'revision', grupo, motivo:`Monto mayor a la tabla (${money(tabla[tabla.length-1][0])})` };
  if(d < 20) return { estado:'ok', grupo, monto: fila[1], desde: fila[0], motivo:'Plan Recibo' };
  if(grupo === '1'){
    if(d < 55) return { estado:'revision', grupo, motivo:'1 crédito y 20 días o más' };
    return { estado:'no', grupo, monto: 0, motivo:'1 crédito y 55 días o más' };
  }
  const corte = grupo === '2' ? 55 : 60;
  if(d < 40) return { estado:'ok', grupo, monto: fila[2], motivo:'Aprobado' };
  if(d < corte) return { estado:'ok', grupo, monto: fila[3], motivo:'Aprobado' };
  return { estado:'revision', grupo, motivo:`${corte} días de atraso o más` };
}

/* ================= Lista ================= */
async function cargarLista(){
  const [clientes, etapas, resumen] = await Promise.all([crmListClientes(), crmListEtapas(), crmListResumenPrestamos()]);
  etapasCache = etapas;
  // Opciones de los filtros (etapas del Kanban y tramos de mora).
  const selE = document.getElementById('fEtapa'), selT = document.getElementById('fTramo');
  const vE = selE.value, vT = selT.value;
  selE.innerHTML = '<option value="">Etapa: Todas</option>' + etapas.map(e => `<option value="${escapeHtml(e.id)}">Etapa: ${escapeHtml(e.name)}</option>`).join('');
  selT.innerHTML = '<option value="">Tramo mora: Todos</option>' + ((window.CMMora && CMMora.TRAMOS_MORA) || []).map(t => `<option value="${t.id}">Tramo mora: ${escapeHtml(t.nombre)}</option>`).join('');
  selE.value = vE; selT.value = vT;
  if(!selE.__ok){
    selE.__ok = true;
    ['fEtapa','fTramo','fEstado','fOrden'].forEach(id => document.getElementById(id).addEventListener('change', renderLista));
    document.getElementById('fLimpiar').addEventListener('click', () => {
      ['fEtapa','fTramo','fEstado'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fOrden').value = 'nombre';
      renderLista();
    });
  }
  // El resumen trae el préstamo principal de cada cliente (activo o, si ya
  // no tiene ninguno, el cancelado) con el atraso que recalcula el worker
  // todos los días desde las cuotas.
  clientesCache = clientes
    .map(c => ({ ...c, _prestamo: (resumen || {})[c.id] || null }))
    .sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
  renderLista();
}

function celdaTramo(c){
  const p = c._prestamo;
  if((p && p.estado === 'cancelado') || tieneEtiqueta(c.etiquetas, 'cancelado')) return `<span class="tag verde">✅ Cancelado</span>`;
  if(!p) return '<span class="gris-txt">—</span>';
  const t = tramoInfo(p.dias_atraso);
  return `<span class="tag ${t.cls}">${escapeHtml(t.nombre)}</span>`;
}

function renderLista(){
  const q = document.getElementById('buscarCliente').value.trim().toLowerCase();
  const fE = document.getElementById('fEtapa').value, fT = document.getElementById('fTramo').value;
  const fS = document.getElementById('fEstado').value, fO = document.getElementById('fOrden').value;
  const cancelado = c => (c._prestamo && c._prestamo.estado === 'cancelado') || tieneEtiqueta(c.etiquetas, 'cancelado');
  const dias = c => (c._prestamo && !cancelado(c) && Number(c._prestamo.dias_atraso)) || 0;
  const saldo = c => (c._prestamo && !cancelado(c) && Number(c._prestamo.importe_atraso)) || 0;
  const filtrados = clientesCache.filter(c => !q || c.nombre.toLowerCase().includes(q) || (c.dni||'').includes(q) || String(c._prestamo && c._prestamo.nro || '').includes(q))
    .filter(c => !fE || (etapaDe(c.stage) || {}).id === fE)
    .filter(c => !fT || (c._prestamo && !cancelado(c) && tramoInfo(c._prestamo.dias_atraso).id === fT))
    .filter(c => !fS || (fS === 'activo' ? c._prestamo && !cancelado(c) : fS === 'atraso' ? dias(c) > 0 : fS === 'cancelado' ? cancelado(c) : !c._prestamo));
  if(fO === 'dias') filtrados.sort((a, b) => dias(b) - dias(a));
  else if(fO === 'saldo') filtrados.sort((a, b) => saldo(b) - saldo(a));
  const hayFiltro = fE || fT || fS || fO !== 'nombre';
  document.getElementById('fLimpiar').style.display = hayFiltro ? '' : 'none';
  document.getElementById('fCuenta').textContent = (hayFiltro || q) ? `${filtrados.length} de ${clientesCache.length}` : '';
  document.getElementById('headerSub').textContent = `${clientesCache.length} clientes en tu cartera`;
  const tbody = document.getElementById('tablaClientes');
  if(!filtrados.length){
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Sin clientes${q ? ' que coincidan con la búsqueda' : ' todavía — importalos desde Kanban de Cartera → Importar cartera'}.</td></tr>`;
    return;
  }
  tbody.innerHTML = filtrados.map(c => {
    const p = c._prestamo;
    const activo = p && p.estado !== 'cancelado';
    return `
    <tr class="row-cliente" data-id="${escapeHtml(c.id)}">
      <td><div class="nombre-celda"><div class="avatar" style="background:${colorParaNombre(c.nombre)}">${escapeHtml(iniciales(c.nombre))}</div>${escapeHtml(c.nombre)}</div></td>
      <td>${escapeHtml(fmtDni(c.dni))}</td>
      <td>${tagEtapa(c.stage) || '—'}</td>
      <td>${celdaTramo(c)}</td>
      <td>${activo && p.importe_atraso ? `<span class="rojo-txt">${money(p.importe_atraso)}</span>` : '<span class="gris-txt">—</span>'}</td>
      <td>${activo && p.dias_atraso ? `<span class="tag rojo">${p.dias_atraso} d</span>` : '<span class="gris-txt">—</span>'}</td>
      <td>${c.telefono ? escapeHtml(telFmt(c.telefono)) : '—'}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr.row-cliente').forEach(tr => tr.addEventListener('click', () => abrirFicha(tr.dataset.id)));
}

async function abrirFicha(clienteId){
  if(!etapasCache.length) etapasCache = await crmListEtapas();
  const [ficha, telefonos, timeline] = await Promise.all([
    crmGetFichaCliente(clienteId),
    crmListTelefonosCliente(clienteId),

// Estado de cada cuota, ya recalculado al día de hoy por crmGetFichaCliente.
function estadoCuotaHtml(q){
  const est = String(q.estado || '').toLowerCase();
  const monto = Number(q.monto) || 0, pagado = Number(q.monto_pagado) || 0;
  const parcial = est !== 'pagada' && pagado > 0 && pagado < monto - 1;
  const tagParcial = parcial ? `<span class="tag ambar">Pago parcial ${money(pagado)}</span>` : '';
  if(est === 'pagada') return `<span class="tag verde">Pagada</span>`;
  if(est === 'vencida'){
    const dias = q.vencimiento && window.CMMora ? Math.max(0, CMMora.diasEntre(q.vencimiento, hoy())) : 0;
    return `<span class="tag rojo">Vencida${dias ? ' · ' + dias + ' d' : ''}</span>${tagParcial}`;
  }
  return tagParcial || `<span class="tag gris">Pendiente</span>`;
}
function estadoPrestamoTag(est){
  if(est === 'cancelado') return `<span class="tag verde">Cancelado</span>`;
  if(est === 'activo') return `<span class="tag azul">Activo</span>`;
  if(est === 'refinanciado') return `<span class="tag cian">Refinanciado</span>`;
  return `<span class="tag gris">${escapeHtml(est || '—')}</span>`;
}
// Atraso máximo del préstamo principal: el mayor entre el atraso de hoy y
// las cuotas que se pagaron tarde (las que tienen fecha de pago). Las
// cuotas importadas del Excel no traen la fecha en que se pagaron, así que
// para ésas no se sabe y cuenta solo el atraso actual.
function atrasoMaximo(prestamo, esPrincipal){
  let max = Number(prestamo.dias_atraso) || 0;
  if(esPrincipal && fichaActual.mora) max = Math.max(fichaActual.mora.dias_atraso || 0, 0);
  if(esPrincipal && window.CMMora){
    (fichaActual.cuotas || []).forEach(q => {
      if(q.vencimiento && q.pagado_el) max = Math.max(max, CMMora.diasEntre(q.vencimiento, q.pagado_el));
    });
  }
  return max;
}

  regla:    { color:'#8b5cf6', icono:'🤖' },
  recibido: { color:'#16a34a', icono:'💬' },
  enviado:  { color:'#2563eb', icono:'💬' },

  promesa:  { color:'#f59e0b', icono:'🤝' },
  nota:     { color:'#94a3b8', icono:'📝' },
  pago:     { color:'#16a34a', icono:'💵' },
};
const FILTROS_TIMELINE = [
  { id:'todo', nombre:'Todo' },
  { id:'mensajes', nombre:'Mensajes' },
  { id:'gestion', nombre:'Gestión' },
  { id:'notas', nombre:'Notas' },

];
const ORIGEN_PAGO = {
  whatsapp: 'confirmado desde WhatsApp',
  kanban: 'confirmado desde el Kanban',
  excel: 'importado de Registro de pagos',
  manual: 'cargado a mano',
};

function cuandoEvento(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const hora = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false });
  const ahora = new Date();
  if(d.toDateString() === ahora.toDateString()) return 'Hoy ' + hora;
  const ayer = new Date(ahora); ayer.setDate(ayer.getDate() - 1);
  if(d.toDateString() === ayer.toDateString()) return 'Ayer ' + hora;
  const fecha = d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
  return (d.getFullYear() === ahora.getFullYear() ? fecha : fecha + '/' + String(d.getFullYear()).slice(2)) + ' ' + hora;
}
function nombreEtapa(clave, nombreGuardado){
  const e = clave ? etapaDe(clave) : null;
  return e ? e.name : (nombreGuardado || clave || '—');
}

// Pasa cada ítem de crmGetTimelineCliente a las filas que se dibujan. Un
// evento de regla puede ser dos cosas a la vez (detectó una promesa Y movió
// la tarjeta): se muestra como dos filas, igual que en el render.
function filasTimeline(items){
  const filas = [];
  (items || []).forEach(ev => {
    const d = ev.detalle || {};
    const base = { id: ev.id, fecha: ev.fecha };
    if(ev.tipo === 'regla'){
      const a = d.accion || {};
      if(a.mueve_a){
        filas.push({ ...base, estilo:'regla', grupo:'gestion',
          titulo:`<b>Movido a ${escapeHtml(nombreEtapa(a.mueve_a))}</b>`,
          extra:'regla automática' + (d.regla ? ` “${d.regla}”` : '') });
      }
      if(d.fecha_detectada){
        filas.push({ ...base, id: base.id + 'p', estilo:'promesa', grupo:'gestion',
          titulo:`<b>Promesa de pago ${fmtFecha(d.fecha_detectada, true)}</b>`, extra:'detectada por regla' });
      }
      if(!a.mueve_a && !d.fecha_detectada){
        filas.push({ ...base, estilo:'regla', grupo:'gestion',
          titulo: a.etiqueta ? `<b>Etiqueta ${escapeHtml(a.etiqueta)}</b>` : `<b>Regla “${escapeHtml(d.regla || '')}”</b>`,
          extra:'regla automática' + (d.regla && a.etiqueta ? ` “${d.regla}”` : '') });
      }
    } else if(ev.tipo === 'etapa'){
      filas.push({ ...base, estilo:'etapa', grupo:'gestion',
        titulo:`<b>Movido a ${escapeHtml(nombreEtapa(d.a, d.a_nombre))}</b>`,
        extra: d.manual === false ? '' : 'a mano' });
    } else if(ev.tipo === 'promesa'){
      filas.push({ ...base, estilo:'promesa', grupo:'gestion',
        titulo:`<b>Promesa de pago${d.fecha ? ' ' + fmtFecha(d.fecha, true) : ''}</b>`,
        extra: d.manual === false ? 'detectada por regla' : 'cargada a mano' });
    } else if(ev.tipo === 'nota'){
      filas.push({ ...base, estilo:'nota', grupo:'notas',
        titulo:`<b>Nota interna</b>${d.autor ? ' · ' + escapeHtml(nombreCorto(d.autor)) : ''}`, texto: d.texto || '' });
    } else if(ev.tipo === 'pago'){
      filas.push({ ...base, estilo:'pago', grupo:'pagos', titulo: tituloPago(d), extra: ORIGEN_PAGO[d.origen] || (d.origen ? 'desde ' + d.origen : '') });
    } else if(ev.tipo === 'mensaje'){
      const saliente = d.direccion === 'saliente';
      const adjunto = { imagen:'imagen', pdf:'PDF', audio:'audio' }[d.tipo];
      let autor = '';
      if(saliente) autor = d.enviado_por ? nombreCorto(nombreUsuario) : 'desde el celular';
      filas.push({ ...base, estilo: saliente ? 'enviado' : 'recibido', grupo:'mensajes',
        titulo:`<b>Mensaje ${saliente ? 'enviado' : 'recibido'}</b>${adjunto ? ' + ' + adjunto : ''}${autor ? ' · ' + escapeHtml(autor) : ''}`,
        texto: d.texto || '', media: d.media_path ? { path: d.media_path, tipo: d.tipo } : (adjunto ? { path:null, tipo:d.tipo } : null) });
    }
  });
  return filas;
}

// "Pago cuota 5 · $86.400" cuando el pago cubrió justo una cuota; si saldó
// todo, "Canceló el préstamo".
function tituloPago(d){
  const monto = Number(d.monto) || 0;
  const p = fichaActual && fichaActual.prestamoActivo;
  const cuota = p && Number(p.cuota_monto) || 0;
  const pagas = Number(d.cuotas_pagas);
  let titulo = 'Pago';
  if(d.cancelado) return `<b>Pago${monto ? ' · ' + money(monto) : ''}</b> · ✅ Canceló el préstamo`;
  if(cuota && monto && Math.abs(monto - cuota) <= 1 && Number.isFinite(pagas) && pagas > 0 && Math.abs(pagas - Math.round(pagas)) < 0.02){
    titulo = 'Pago cuota ' + Math.round(pagas);
  }
  return `<b>${titulo}${monto ? ' · ' + money(monto) : ''}</b>`;
}

function filaTimelineHtml(f){
  const est = ESTILO_EVENTO[f.estilo] || { color:'#94a3b8', icono:'•' };
  let media = '';
  if(f.media){
    const etiqueta = f.media.tipo === 'pdf' ? '📄 PDF' : f.media.tipo === 'audio' ? '🎙️ Audio' : '🧾 IMG';
    media = f.media.path
      ? `<a class="tl-media" href="#" data-media="${escapeHtml(f.media.path)}" data-tipo="${escapeHtml(f.media.tipo)}" title="Abrir adjunto">${etiqueta}</a>`
      : `<span class="tl-media" title="El adjunto no se descargó">${etiqueta}</span>`;
  }
  return `<div class="tl-item">
    <span class="tl-dot" style="background:${est.color}"></span>
    <div class="tl-titulo">${est.icono} ${f.titulo}</div>
    <div class="tl-cuando">${escapeHtml(cuandoEvento(f.fecha))}${f.extra ? ' · ' + escapeHtml(f.extra) : ''}</div>
    ${f.texto ? `<div class="tl-texto">${escapeHtml(f.texto)}</div>` : ''}
    ${media}
  </div>`;
}

function renderTimeline(){
  const cont = document.getElementById('timeline');
  if(!cont) return;
  const todas = filasTimeline(timelineActual);
  const filas = filtroTimeline === 'todo' ? todas : todas.filter(f => f.grupo === filtroTimeline);
  const filtro = FILTROS_TIMELINE.find(x => x.id === filtroTimeline);
  document.getElementById('filtroBtn').textContent = (filtro ? filtro.nombre : 'Todo') + ' ▾';
  document.querySelectorAll('#filtroMenu button').forEach(b => b.classList.toggle('activo', b.dataset.f === filtroTimeline));
  cont.innerHTML = filas.length ? filas.map(filaTimelineHtml).join('')
    : `<div class="tl-vacio">${filtroTimeline === 'todo' ? 'Todavía no hay gestión registrada.' : 'No hay nada de este tipo todavía.'}</div>`;
  cargarMiniaturas(cont);
}

// Fotos y PDF de los chats viven en el bucket privado "comprobantes": se
// pide un link firmado (dura 1 hora), como en la Bandeja.
async function cargarMiniaturas(cont){
  const links = [...cont.querySelectorAll('a.tl-media[data-media]')];
  await Promise.all(links.map(async a => {
    try{
      const { data } = await window.sb.storage.from('comprobantes').createSignedUrl(a.dataset.media, 3600);
      if(!data || !data.signedUrl) return;
      a.href = data.signedUrl; a.target = '_blank'; a.rel = 'noopener';
      if(a.dataset.tipo === 'imagen'){
        const img = new Image();
        img.alt = 'Imagen';
        img.onload = () => { a.innerHTML = ''; a.appendChild(img); };
        img.src = data.signedUrl;
      }
    }catch(e){ console.error('miniatura', e); }
  }));
}

  renderTimeline();

function renderFicha(telefonos){
  const { cliente, prestamos, prestamoActivo: p, cuotas, mora } = fichaActual;

  // sin plan, se usan los del préstamo tal cual vinieron del Excel.
  const saldoVencido = mora ? mora.importe_atraso : (p ? (p.importe_atraso || 0) : 0);
  const saldoTotal = mora ? mora.saldo_total : (p ? (p.saldo_total_punitorios || p.saldo_total || 0) : 0);
  const diasAtraso = mora ? mora.dias_atraso : (p ? (p.dias_atraso || 0) : 0);
  const cancelado = (p && p.estado === 'cancelado') || (mora && mora.cancelado) || tieneEtiqueta(cliente.etiquetas, 'cancelado');

  // Para la Calculadora: el "último crédito" es el más reciente que tenga monto.
  const ultimo = [...historial].reverse().find(x => Number(x.monto) > 0) || p;

      <button class="btn" id="btnEditar">✎ Editar</button>

  const domicilio = [cliente.domicilio, cliente.localidad].filter(Boolean).join(', ');
  const etiquetas = (cliente.etiquetas || []).filter(e => String(e).toLowerCase() !== 'cancelado');
  const cantCuotas = (p && p.cant_cuotas) || cuotas.length;

          ${cliente.email ? `<div class="fila"><span class="k">✉️ Email</span><span class="v">${escapeHtml(cliente.email)}</span></div>` : ''}
        </div>
        <div class="card">
          <div class="card-head"><span class="card-titulo">Asignación</span></div>
          <div class="fila"><span class="k">Cobrador</span><span class="v">${escapeHtml(nombreCorto(cliente.cobrador_nombre || nombreUsuario) || '—')}</span></div>
          <div class="fila"><span class="k">Cartera</span><span class="v">${cancelado ? 'Cancelado' : escapeHtml(tramo.nombre)}</span></div>
          <div class="fila"><span class="k">Etiquetas</span><span class="v">${etiquetas.length ? etiquetas.map(e => `<span class="tag violeta">${/comprobante/i.test(e) ? '📎 ' : ''}${escapeHtml(e)}</span>`).join('') : '—'}</span></div>
          ${cliente.promesa_fecha ? `<div class="fila"><span class="k">Promesa de pago</span><span class="v">${fmtFecha(cliente.promesa_fecha)}</span></div>` : ''}
        </div>
      </div>

      <div class="col">
        <div class="indicadores">
          <div class="indicador"><div class="label">Saldo vencido</div><div class="valor ${saldoVencido > 0 ? 'rojo' : ''}">${money(saldoVencido)}</div></div>
          <div class="indicador"><div class="label">Saldo total</div><div class="valor">${money(saldoTotal)}</div></div>
          <div class="indicador"><div class="label">Días de atraso</div><div class="valor ${diasAtraso > 0 ? 'rojo' : ''}">${diasAtraso}</div></div>
          <div class="indicador clic" id="indProxCredito" title="${escapeHtml(pcTitulo)}"><div class="label">Próximo crédito</div><div class="valor ${pcCls}">${pcValor}</div><div class="sub">${escapeHtml(pcSub)} · ${escapeHtml(cantTxt)}</div></div>
        </div>
        ${p ? `
        <div class="card">
          <div class="card-head"><span class="card-titulo">Plan de cuotas · Préstamo #${escapeHtml(p.nro)}</span>
            <span class="card-derecha">${[p.monto ? money(p.monto) : '', cantCuotas ? cantCuotas + ' cuotas' : '', p.tna ? 'TNA ' + Number(p.tna).toLocaleString('es-AR') + '%' : ''].filter(Boolean).join(' · ')}</span></div>
          <table class="tabla">
            <thead><tr><th>Cuota</th><th>Vencimiento</th><th>Monto</th><th>Estado</th><th>Pagó el</th></tr></thead>
            <tbody>
              ${cuotas.length ? cuotas.map(q => `<tr>
                <td class="num"><b>${q.numero}</b>/${cantCuotas}</td>
                <td>${fmtFecha(q.vencimiento)}</td>
                <td>${money(q.monto)}</td>
                <td>${estadoCuotaHtml(q)}</td>
                <td>${q.pagado_el ? fmtFecha(q.pagado_el, true) : '—'}</td>
              </tr>`).join('') : `<tr><td colspan="5" class="empty-state">Sin plan de cuotas cargado.</td></tr>`}
            </tbody>
          </table>
        </div>` : ''}
        <div class="card">
          <div class="card-head"><span class="card-titulo">Historial de créditos</span></div>
          <table class="tabla">
            <thead><tr><th>Préstamo</th><th>Alta</th><th>Monto</th><th>Cuotas</th><th>Estado</th><th>Atraso máx.</th></tr></thead>
            <tbody>
              ${historial.length ? historial.map(x => `<tr>
                <td>#${escapeHtml(x.nro)}</td>
                <td>${fmtMesAnio(x.fecha_alta)}</td>
                <td>${x.monto ? money(x.monto) : '—'}</td>
                <td>${x.cant_cuotas || '—'}</td>
                <td>${estadoPrestamoTag(x === p && cancelado ? 'cancelado' : x.estado)}</td>
                <td>${atrasoMaximo(x, x === p)} d</td>
              </tr>`).join('') : `<tr><td colspan="6" class="empty-state">Sin préstamos cargados.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="col">
        <div class="card card-historial">
          <div class="card-head">
            <span class="card-titulo">Historial de gestión</span>
            <div class="filtro-wrap">
              <button class="filtro-btn" id="filtroBtn">Todo ▾</button>
              <div class="filtro-menu" id="filtroMenu">
                ${FILTROS_TIMELINE.map(f => `<button data-f="${f.id}">${f.nombre}</button>`).join('')}
              </div>
            </div>
          </div>
          <div class="timeline" id="timeline"></div>
          <div class="nota-box">
            <input type="text" id="notaTexto" placeholder="📝 Escribir nota interna...">
            <button class="btn btn-azul" id="btnGuardarNota">Guardar</button>
          </div>
        </div>
      </div>
    </div>`;

  renderTimeline();

  document.getElementById('btnVolverLista').addEventListener('click', volverALista);
  document.getElementById('btnAbrirChat').addEventListener('click', () => {
    window.top.postMessage({ type: 'cm-abrir-chat-cliente', clienteId: cliente.id }, '*');
  });
  document.getElementById('btnRefinanciar').addEventListener('click', async (e) => {
    const etapaRef = etapasCache.find(x => x.id === 'refinanciado');
    if(!etapaRef) { alert('No se encontró la etapa "Refinanciado" en tu Kanban.'); return; }
    if(!confirm(`¿Pasar a ${cliente.nombre} a "${etapaRef.name}"? Queda registrado en el historial de gestión.`)) return;
    e.currentTarget.disabled = true;
    try{
      // crmMoverEtapa (y no un update suelto) para que el cambio quede en el
      // historial de gestión como "Movido a Refinanciado · a mano".
      await crmMoverEtapa(cliente.id, etapaRef._rowId);
    }catch(err){
      alert('No se pudo cambiar la etapa. Probá de nuevo.');
      e.currentTarget.disabled = false;
      return;
    }
    irAVista('view-refi');
  });
  const abrirCalculadora = () => irAVista('view-calc');
  document.getElementById('btnProxCredito').addEventListener('click', abrirCalculadora);
  document.getElementById('indProxCredito').addEventListener('click', abrirCalculadora);
  document.getElementById('btnEditar').addEventListener('click', () => {
    window.top.postMessage({ type: 'cm-editar-cliente-kanban', clienteId: cliente.id }, '*');
  });
  document.getElementById('btnAgregarTel').addEventListener('click', async () => {
    const crudo = prompt('Nuevo teléfono (con código de área, ej: 11 4892-0013):');
    if(!crudo) return;
    const tel = window.normalizarTelefonoAR && window.normalizarTelefonoAR(crudo);
    if(!tel){ alert('Teléfono inválido.'); return; }
    const { error } = await window.sb.from('clientes_telefonos').insert({ cliente_id: cliente.id, telefono: tel, etiqueta: 'Celular', principal: !telefonos.length });
    if(error){ alert('No se pudo guardar el teléfono (¿ya estaba cargado?).'); return; }
    await abrirFicha(cliente.id);
  });

  const menu = document.getElementById('filtroMenu');
  document.getElementById('filtroBtn').addEventListener('click', ev => { ev.stopPropagation(); menu.classList.toggle('abierto'); });
  menu.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    filtroTimeline = b.dataset.f;
    menu.classList.remove('abierto');
    renderTimeline();
  }));

  const guardarNota = async () => {
    const input = document.getElementById('notaTexto');
    const boton = document.getElementById('btnGuardarNota');
    const texto = input.value.trim();
    if(!texto || boton.disabled) return;
    boton.disabled = true;
    try{
      await crmAgregarNotaCliente(cliente.id, texto);
      input.value = '';
      // Si estaba filtrando otra cosa, se vuelve a "Todo" para ver la nota.
      if(filtroTimeline !== 'todo' && filtroTimeline !== 'notas') filtroTimeline = 'todo';
      await recargarTimeline();
    }catch(err){
      alert('No se pudo guardar la nota. Probá de nuevo.');
    }finally{
      boton.disabled = false;
    }
  };
  document.getElementById('btnGuardarNota').addEventListener('click', guardarNota);
  document.getElementById('notaTexto').addEventListener('keydown', e => { if(e.key === 'Enter') guardarNota(); });
}

// Cerrar el menú "Todo ▾" al hacer clic afuera.
document.addEventListener('click', () => { const m = document.getElementById('filtroMenu'); if(m) m.classList.remove('abierto'); });
document.getElementById('buscarCliente').addEventListener('input', renderLista);

/* ===== Tema (lo manda el panel principal) ===== */
const THEME_KEY = 'cm_theme_v2';
function applyTheme(theme){ document.documentElement.setAttribute('data-theme', theme==='dark'?'dark':'light'); }
window.addEventListener('message', e=>{
  if(e.data && e.data.type==='cm-theme') applyTheme(e.data.theme);
  if(e.data && e.data.type==='cm-abrir-cliente' && e.data.id) abrirFicha(e.data.id);
});

/* ===== Auth + carga inicial ===== */
sb.auth.getSession().then(async ({ data: { session } }) => {
  if (!session) { location.href = 'index.html'; return; }
  await crmBootstrap();
  window._markAppReady();
});
sb.auth.onAuthStateChange((_event, session) => { if (!session) location.href = 'index.html'; });

window.appReady.then(async ()=>{
  const saved = await kvGet(THEME_KEY);
  if (saved) applyTheme(saved);
  nombreUsuario = await crmGetNombreUsuario().catch(() => '') || '';
  await cargarLista();
});
</script>
</body>
</html>
