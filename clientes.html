<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes — Cash Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="supabase/kv.js"></script>
<script src="js/telefonos.js"></script>
<script src="supabase/crm.js"></script>
<style>
  /* Paleta del plan (render 5.3): claro por defecto, oscuro opcional. */
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel-2:#f8fafc; --line:#e2e8f0; --line-2:#f1f5f9;
    --text:#0f172a; --text-2:#334155; --muted:#64748b; --faint:#94a3b8;
    --blue:#2563eb; --green:#16a34a; --green-hover:#15803d; --red:#b91c1c;
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --panel:#0f172a; --panel-2:#111c33; --line:#1e293b; --line-2:#162036;
    --text:#e2e8f0; --text-2:#cbd5e1; --muted:#94a3b8; --faint:#64748b;
    --blue:#60a5fa; --green:#22c55e; --green-hover:#16a34a; --red:#f87171;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}

  header{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel);}
  .head-izq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;}
  header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .header-sub{font-size:13px;color:var(--muted);}
  .miga{font-size:14px;color:var(--muted);background:none;border:none;padding:0;}
  .miga:hover{color:var(--blue);}
  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:300px;}
  .search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
  .btn:hover{border-color:var(--faint);}
  .btn-verde{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-verde:hover{background:var(--green-hover);}
  .btn-azul{background:var(--blue);border-color:var(--blue);color:#fff;}

  .tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;background:#f1f5f9;color:#475569;display:inline-flex;align-items:center;}
  .tag.verde{background:#dcfce7;color:#15803d;} .tag.rojo{background:#fee2e2;color:#b91c1c;}
  .tag.ambar{background:#fef3c7;color:#b45309;} .tag.violeta{background:#ede9fe;color:#6d28d9;}
  .tag.azul{background:#dbeafe;color:#1d4ed8;} .tag.cian{background:#cffafe;color:#0e7490;} .tag.gris{background:#f1f5f9;color:#475569;}

  main{padding:18px 22px;}
  /* ---- Lista ---- */
  .lista-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  tr.row-cliente{cursor:pointer;}
  tr.row-cliente:hover td{background:var(--panel-2);}
  .nombre-celda{display:flex;align-items:center;gap:10px;font-weight:700;}
  .nombre-celda .avatar{width:30px;height:30px;font-size:11px;}
  .rojo-txt{color:var(--red);font-weight:700;}

  /* ---- Ficha ---- */
  #vistaFicha{display:none;}
  .ficha-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:16px;align-items:start;}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .card-titulo{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .card-link{font-size:13px;font-weight:700;color:var(--blue);background:none;border:none;padding:0;}
  .card-derecha{font-size:12.5px;color:var(--muted);}
  .fila{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;align-items:center;}
  .fila .k{color:var(--muted);white-space:nowrap;}
  .fila .v{font-weight:700;text-align:right;overflow-wrap:anywhere;}
  .indicadores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .indicador{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .indicador .label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.3;}
  .indicador .valor{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.01em;}
  .indicador .valor.rojo{color:var(--red);} .indicador .valor.verde{color:var(--green-hover);}
  .indicador .valor.chico{font-size:17px;}
  .tabla{width:100%;}
  .tabla th{background:var(--panel-2);font-size:12.5px;padding:8px 10px;}
  .tabla td{font-size:13.5px;padding:9px 10px;}
  .tabla td:first-child{font-weight:700;}
  .empty-state{color:var(--muted);font-size:13px;padding:24px;text-align:center;}

  .timeline{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 290px);overflow-y:auto;padding-right:4px;}
  .tl-item{display:grid;grid-template-columns:12px 1fr;gap:9px;}
  .tl-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;}
  .tl-titulo{font-size:13.5px;}
  .tl-titulo b{font-weight:700;}
  .tl-cuando{font-size:12px;color:var(--faint);margin-top:1px;}
  .tl-texto{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:13px;color:var(--text-2);line-height:1.4;}
  .nota-box{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .nota-box input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;}
  .nota-box input:focus{border-color:var(--blue);}

  @media (max-width:1250px){ .ficha-grid{grid-template-columns:280px minmax(0,1fr);} .ficha-grid > .col:last-child{grid-column:1 / -1;} .indicadores{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:800px){ .ficha-grid{grid-template-columns:1fr;} }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#334155;}
</style>
</head>
<body>

<header>
  <div class="head-izq" id="headIzq">
    <h1>👥 Clientes</h1>
    <span class="header-sub" id="headerSub"></span>
  </div>
  <div id="headDer">
    <div class="search" id="searchWrap">
      <span>🔍</span>
      <input type="text" id="buscarCliente" placeholder="Buscar por nombre, DNI o préstamo...">
    </div>
  </div>
</header>

<main>
  <div id="vistaLista">
    <div class="lista-card">
      <table>
        <thead><tr><th>Cliente</th><th>DNI</th><th>Etapa</th><th>Saldo vencido</th><th>Días de atraso</th><th>Teléfono</th></tr></thead>
        <tbody id="tablaClientes"></tbody>
      </table>
    </div>
  </div>

  <div id="vistaFicha"></div>
</main>

<script>
let clientesCache = [];
let etapasCache = [];
let fichaActual = null;
let nombreUsuario = '';

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$' + Math.round(Number(n)||0).toLocaleString('es-AR'); }
function fmtFecha(iso, corto){
  if(!iso) return '—';
  const [y,m,d] = String(iso).slice(0,10).split('-');
  return corto ? `${d}/${m}` : `${d}/${m}/${y}`;
}
function fmtMesAnio(iso){ if(!iso) return '—'; const [y,m] = String(iso).slice(0,10).split('-'); return `${m}/${y}`; }
function fmtDni(dni){ const d = String(dni||'').replace(/\D/g,''); return d.length >= 7 ? Number(d).toLocaleString('es-AR') : (dni || '—'); }
function iniciales(nombre){
  const partes = String(nombre||'?').trim().split(/\s+/);
  return (((partes[0]||'')[0]||'') + ((partes[1]||'')[0]||'')).toUpperCase() || '?';
}
const AVATAR_PALETTE = ['#db2777','#0891b2','#7c3aed','#ea580c','#16a34a','#dc2626','#ca8a04','#2563eb'];
function colorParaNombre(nombre){
  let hash = 0; const s = String(nombre||'');
  for(let i=0;i<s.length;i++) hash = (hash*31 + s.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(hash)];
}
const CLS_ETAPA = { a_contactar:'gris', contactado:'azul', promesa:'ambar', verificar_pago:'violeta', refinanciado:'cian', cerrado:'verde' };
function etapaDe(clave){ return etapasCache.find(x => x.id === clave || x._rowId === clave) || null; }
function tagEtapa(clave){
  const e = etapaDe(clave);
  return e ? `<span class="tag ${CLS_ETAPA[e.id] || 'gris'}">${escapeHtml(e.name)}</span>` : '';
}
function telFmt(t){ return (window.formatearTelefonoAR && window.formatearTelefonoAR(window.normalizarTelefonoAR ? (window.normalizarTelefonoAR(t) || t) : t)) || t; }
function irAVista(view){ window.top.postMessage({ type:'cm-ir-a-vista', view }, '*'); }

/* ================= Lista ================= */
async function cargarLista(){
  const [clientes, etapas] = await Promise.all([crmListClientes(), crmListEtapas()]);
  etapasCache = etapas;
  // Saldo vencido y días de atraso viven en prestamos — se traen aparte, en
  // lote. Si un cliente tiene más de un préstamo "activo" (p. ej. uno cargado
  // solo desde la Hoja de Ruta, sin saldo), se prioriza el que tiene saldo.
  const { data: prestamos } = await window.sb.from('prestamos').select('cliente_id, nro, importe_atraso, dias_atraso, estado, saldo_total').eq('estado', 'activo');
  const prestamoPorCliente = {};
  (prestamos || []).forEach(p => {
    const actual = prestamoPorCliente[p.cliente_id];
    if (!actual || (actual.saldo_total === null && p.saldo_total !== null)) prestamoPorCliente[p.cliente_id] = p;
  });
  clientesCache = clientes.map(c => ({ ...c, _prestamo: prestamoPorCliente[c.id] || null }));
  renderLista();
}

function renderLista(){
  const q = document.getElementById('buscarCliente').value.trim().toLowerCase();
  const filtrados = clientesCache.filter(c => !q || c.nombre.toLowerCase().includes(q) || (c.dni||'').includes(q) || String(c._prestamo && c._prestamo.nro || '').includes(q));
  document.getElementById('headerSub').textContent = `${clientesCache.length} clientes en tu cartera`;
  const tbody = document.getElementById('tablaClientes');
  if(!filtrados.length){
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Sin clientes${q ? ' que coincidan con la búsqueda' : ' todavía — importalos desde Kanban de Cartera → Importar cartera'}.</td></tr>`;
    return;
  }
  tbody.innerHTML = filtrados.map(c => `
    <tr class="row-cliente" data-id="${c.id}">
      <td><div class="nombre-celda"><div class="avatar" style="background:${colorParaNombre(c.nombre)}">${iniciales(c.nombre)}</div>${escapeHtml(c.nombre)}</div></td>
      <td>${escapeHtml(fmtDni(c.dni))}</td>
      <td>${tagEtapa(c.stage) || '—'}</td>
      <td>${c._prestamo && c._prestamo.importe_atraso ? `<span class="rojo-txt">${money(c._prestamo.importe_atraso)}</span>` : '—'}</td>
      <td>${c._prestamo && c._prestamo.dias_atraso ? `<span class="tag rojo">${c._prestamo.dias_atraso} d</span>` : '—'}</td>
      <td>${c.telefono ? escapeHtml(telFmt(c.telefono)) : '—'}</td>
    </tr>`).join('');
  tbody.querySelectorAll('tr.row-cliente').forEach(tr => tr.addEventListener('click', () => abrirFicha(tr.dataset.id)));
}

/* ================= Ficha (render 5.3) ================= */
async function abrirFicha(clienteId){
  if(!etapasCache.length) etapasCache = await crmListEtapas();
  fichaActual = await crmGetFichaCliente(clienteId);
  if(!fichaActual) return;
  const telefonos = await crmListTelefonosCliente(clienteId);
  renderFicha(telefonos);
  document.getElementById('vistaLista').style.display = 'none';
  document.getElementById('vistaFicha').style.display = 'block';
  window.scrollTo(0, 0);
}

function volverALista(){
  fichaActual = null;
  document.getElementById('vistaLista').style.display = 'block';
  document.getElementById('vistaFicha').style.display = 'none';
  document.getElementById('headIzq').innerHTML = `<h1>👥 Clientes</h1><span class="header-sub" id="headerSub"></span>`;
  document.getElementById('headDer').innerHTML = `<div class="search" id="searchWrap"><span>🔍</span><input type="text" id="buscarCliente" placeholder="Buscar por nombre, DNI o préstamo..."></div>`;
  document.getElementById('buscarCliente').addEventListener('input', renderLista);
  cargarLista();
}

function estadoCuotaTag(q){
  const est = String(q.estado || '').toLowerCase();
  if(est === 'pagada') return `<span class="tag verde">Pagada</span>`;
  if(est === 'vencida'){
    const dias = q.vencimiento ? Math.max(0, Math.round((Date.now() - new Date(q.vencimiento + 'T00:00:00')) / 86400000)) : 0;
    return `<span class="tag rojo">Vencida${dias ? ' · ' + dias + ' d' : ''}</span>`;
  }
  return `<span class="tag gris">${escapeHtml(q.estado ? q.estado[0].toUpperCase() + q.estado.slice(1) : 'Pendiente')}</span>`;
}
function estadoPrestamoTag(est){
  if(est === 'cancelado') return `<span class="tag verde">Cancelado</span>`;
  if(est === 'activo') return `<span class="tag azul">Activo</span>`;
  if(est === 'refinanciado') return `<span class="tag cian">Refinanciado</span>`;
  return `<span class="tag gris">${escapeHtml(est || '—')}</span>`;
}

// Línea de tiempo: color e ícono por tipo, como en el render.
const ESTILO_EVENTO = {
  regla:   { color:'#8b5cf6', icono:'🤖' },
  mensaje: { color:'#16a34a', icono:'💬' },
  etapa:   { color:'#2563eb', icono:'➡️' },
  promesa: { color:'#f59e0b', icono:'🤝' },
  nota:    { color:'#94a3b8', icono:'📝' },
  pago:    { color:'#16a34a', icono:'💵' },
};
function cuandoEvento(iso){
  const d = new Date(iso);
  const hoy = new Date();
  const hora = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false });
  if(d.toDateString() === hoy.toDateString()) return 'Hoy ' + hora;
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }) + ' ' + hora;
}
function eventoHtml(ev){
  const est = ESTILO_EVENTO[ev.tipo] || { color:'#94a3b8', icono:'•' };
  const d = ev.detalle || {};
  let titulo = '', extra = '', texto = '';
  if(ev.tipo === 'regla'){
    const a = d.accion || {};
    const destino = a.mueve_a ? etapaDe(a.mueve_a) : null;
    titulo = destino ? `<b>Movido a ${escapeHtml(destino.name)}</b>` : `<b>Regla “${escapeHtml(d.regla || '')}”</b>${a.etiqueta ? ' · etiqueta ' + escapeHtml(a.etiqueta) : ''}`;
    extra = 'regla automática' + (d.fecha_detectada ? ' · fecha ' + fmtFecha(d.fecha_detectada, true) : '');
  } else if(ev.tipo === 'nota'){
    titulo = `<b>Nota interna</b>${d.autor ? ' · ' + escapeHtml(d.autor) : ''}`;
    texto = d.texto || '';
  } else if(ev.tipo === 'pago'){
    titulo = `<b>Pago${d.monto ? ' · ' + money(d.monto) : ''}</b>`;
    extra = d.origen ? 'desde ' + d.origen : '';
  } else if(ev.tipo === 'promesa'){
    titulo = `<b>Promesa de pago${d.fecha ? ' ' + fmtFecha(d.fecha, true) : ''}</b>`;
  } else if(ev.tipo === 'etapa'){
    const destino = d.a ? etapaDe(d.a) : null;
    titulo = `<b>Movido a ${escapeHtml(destino ? destino.name : (d.a || '—'))}</b>`;
  } else if(ev.tipo === 'mensaje'){
    titulo = `<b>Mensaje ${d.direccion === 'saliente' ? 'enviado' : 'recibido'}</b>`;
    texto = d.texto || '';
  } else {
    titulo = `<b>${escapeHtml(ev.tipo)}</b>`;
  }
  return `<div class="tl-item">
    <span class="tl-dot" style="background:${est.color}"></span>
    <div>
      <div class="tl-titulo">${est.icono} ${titulo}</div>
      <div class="tl-cuando">${cuandoEvento(ev.creado_at)}${extra ? ' · ' + escapeHtml(extra) : ''}</div>
      ${texto ? `<div class="tl-texto">${escapeHtml(texto)}</div>` : ''}
    </div>
  </div>`;
}

function renderFicha(telefonos){
  const { cliente, prestamos, prestamoActivo: p, cuotas, eventos } = fichaActual;
  const saldoVencido = p ? (p.importe_atraso || 0) : 0;
  const saldoTotal = p ? (p.saldo_total_punitorios || p.saldo_total || 0) : 0;
  const diasAtraso = p ? (p.dias_atraso || 0) : 0;
  const etapaClave = cliente.etapas ? (cliente.etapas.clave || cliente.etapas.id) : null;
  const principal = telefonos.find(t => t.principal) || telefonos[0];
  const otros = telefonos.filter(t => t !== principal);

  document.getElementById('headIzq').innerHTML = `
    <button class="miga" id="btnVolverLista">👥 Clientes ›</button>
    <div class="avatar" style="background:${colorParaNombre(cliente.nombre)}">${iniciales(cliente.nombre)}</div>
    <h1>${escapeHtml(cliente.nombre)}</h1>
    ${cliente.categoria ? `<span class="tag verde">${escapeHtml(cliente.categoria)}</span>` : ''}
    ${etapaClave ? tagEtapa(etapaClave) : ''}`;
  document.getElementById('headDer').innerHTML = `
    <div class="btn-row">
      <button class="btn btn-verde" id="btnAbrirChat">💬 Abrir chat</button>
      <button class="btn" id="btnRefinanciar">🔁 Refinanciar</button>
      <button class="btn" id="btnProxCredito">🧮 Próximo crédito</button>
      <button class="btn" id="btnEditar">✎ Editar</button>
    </div>`;

  document.getElementById('vistaFicha').innerHTML = `
    <div class="ficha-grid">
      <div class="col">
        <div class="card">
          <div class="card-head"><span class="card-titulo">Datos personales</span></div>
          <div class="fila"><span class="k">DNI</span><span class="v">${escapeHtml(fmtDni(cliente.dni))}</span></div>
          ${cliente.cuil ? `<div class="fila"><span class="k">CUIL</span><span class="v">${escapeHtml(cliente.cuil)}</span></div>` : ''}
          ${cliente.domicilio || cliente.localidad ? `<div class="fila"><span class="k">Domicilio</span><span class="v">${escapeHtml([cliente.domicilio, cliente.localidad].filter(Boolean).join(', '))}</span></div>` : ''}
          ${cliente.empleador ? `<div class="fila"><span class="k">Empleador</span><span class="v">${escapeHtml(cliente.empleador)}</span></div>` : ''}
          ${cliente.creado_at ? `<div class="fila"><span class="k">Alta cliente</span><span class="v">${fmtMesAnio(cliente.creado_at)}</span></div>` : ''}
        </div>
        <div class="card">
          <div class="card-head"><span class="card-titulo">Contacto</span><button class="card-link" id="btnAgregarTel">+ Agregar</button></div>
          ${principal ? `<div class="fila"><span class="k">📱 WhatsApp</span><span class="v">${escapeHtml(telFmt(principal.telefono))} <span class="tag verde" style="margin-left:4px;">Vinculado</span></span></div>` : `<div class="fila"><span class="k">Sin teléfonos cargados</span></div>`}
          ${otros.map(t => `<div class="fila"><span class="k">📞 ${escapeHtml(t.etiqueta === 'Celular' ? 'Alternativo' : t.etiqueta)}</span><span class="v">${escapeHtml(telFmt(t.telefono))}</span></div>`).join('')}
          ${cliente.email ? `<div class="fila"><span class="k">✉️ Email</span><span class="v">${escapeHtml(cliente.email)}</span></div>` : ''}
        </div>
        <div class="card">
          <div class="card-head"><span class="card-titulo">Asignación</span></div>
          <div class="fila"><span class="k">Cobrador</span><span class="v">${escapeHtml(cliente.cobrador_nombre || nombreUsuario || '—')}</span></div>
          ${cliente.segmento ? `<div class="fila"><span class="k">Cartera</span><span class="v">${escapeHtml(cliente.segmento)}</span></div>` : ''}
          <div class="fila"><span class="k">Etiquetas</span><span class="v">${(cliente.etiquetas || []).length ? cliente.etiquetas.map(e => `<span class="tag violeta" style="margin-left:4px;">${/comprobante/i.test(e) ? '📎 ' : ''}${escapeHtml(e)}</span>`).join('') : '—'}</span></div>
          <div class="fila"><span class="k">Promesa de pago</span><span class="v">${cliente.promesa_fecha ? fmtFecha(cliente.promesa_fecha) : '—'}</span></div>
        </div>
      </div>

      <div class="col">
        <div class="indicadores">
          <div class="indicador"><div class="label">Saldo vencido</div><div class="valor rojo">${money(saldoVencido)}</div></div>
          <div class="indicador"><div class="label">Saldo total</div><div class="valor">${money(saldoTotal)}</div></div>
          <div class="indicador"><div class="label">Días de atraso</div><div class="valor ${diasAtraso > 0 ? 'rojo' : ''}">${diasAtraso}</div></div>
          <div class="indicador"><div class="label">Próximo vencimiento</div><div class="valor chico">${p && p.proximo_vencimiento ? fmtFecha(p.proximo_vencimiento) : '—'}</div></div>
        </div>
        ${p ? `
        <div class="card">
          <div class="card-head"><span class="card-titulo">Plan de cuotas · Préstamo #${escapeHtml(p.nro)}</span>
            <span class="card-derecha">${[p.monto ? money(p.monto) : '', p.cant_cuotas ? p.cant_cuotas + ' cuotas' : '', p.tna ? 'TNA ' + p.tna + '%' : ''].filter(Boolean).join(' · ')}</span></div>
          <table class="tabla">
            <thead><tr><th>Cuota</th><th>Vencimiento</th><th>Monto</th><th>Estado</th><th>Pagó el</th></tr></thead>
            <tbody>
              ${cuotas.length ? cuotas.map(q => `<tr>
                <td>${q.numero}/${p.cant_cuotas || cuotas.length}</td>
                <td>${fmtFecha(q.vencimiento)}</td>
                <td>${money(q.monto)}</td>
                <td>${estadoCuotaTag(q)}</td>
                <td>${q.pagado_el ? fmtFecha(q.pagado_el, true) : '—'}</td>
              </tr>`).join('') : `<tr><td colspan="5" class="empty-state">Sin plan de cuotas cargado.</td></tr>`}
            </tbody>
          </table>
        </div>` : ''}
        <div class="card">
          <div class="card-head"><span class="card-titulo">Historial de créditos</span></div>
          <table class="tabla">
            <thead><tr><th>Préstamo</th><th>Alta</th><th>Monto</th><th>Cuotas</th><th>Estado</th><th>Atraso máx.</th></tr></thead>
            <tbody>
              ${prestamos.length ? prestamos.map(x => `<tr>
                <td>#${escapeHtml(x.nro)}</td>
                <td>${fmtMesAnio(x.fecha_alta)}</td>
                <td>${x.monto ? money(x.monto) : '—'}</td>
                <td>${x.cant_cuotas || '—'}</td>
                <td>${estadoPrestamoTag(x.estado)}</td>
                <td>${x.dias_atraso || 0} d</td>
              </tr>`).join('') : `<tr><td colspan="6" class="empty-state">Sin préstamos cargados.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="col">
        <div class="card">
          <div class="card-head"><span class="card-titulo">Historial de gestión</span></div>
          <div class="timeline">
            ${eventos.length ? eventos.map(eventoHtml).join('') : `<div class="empty-state">Todavía no hay gestión registrada.</div>`}
          </div>
          <div class="nota-box">
            <input type="text" id="notaTexto" placeholder="📝 Escribir nota interna...">
            <button class="btn btn-azul" id="btnGuardarNota">Guardar</button>
          </div>
        </div>
      </div>
    </div>`;

  document.getElementById('btnVolverLista').addEventListener('click', volverALista);
  document.getElementById('btnAbrirChat').addEventListener('click', () => {
    window.top.postMessage({ type: 'cm-abrir-chat-cliente', clienteId: cliente.id }, '*');
  });
  document.getElementById('btnRefinanciar').addEventListener('click', async () => {
    const etapaRef = etapasCache.find(e => e.id === 'refinanciado');
    if(!etapaRef) { alert('No se encontró la etapa "Refinanciado" en tu Kanban.'); return; }
    await crmActualizarCliente(cliente.id, { etapa_id: etapaRef._rowId });
    irAVista('view-refi');
  });
  document.getElementById('btnProxCredito').addEventListener('click', () => irAVista('view-calc'));
  document.getElementById('btnEditar').addEventListener('click', () => {
    window.top.postMessage({ type: 'cm-editar-cliente-kanban', clienteId: cliente.id }, '*');
  });
  document.getElementById('btnAgregarTel').addEventListener('click', async () => {
    const crudo = prompt('Nuevo teléfono (con código de área, ej: 11 4892-0013):');
    if(!crudo) return;
    const tel = window.normalizarTelefonoAR && window.normalizarTelefonoAR(crudo);
    if(!tel){ alert('Teléfono inválido.'); return; }
    const { error } = await window.sb.from('clientes_telefonos').insert({ cliente_id: cliente.id, telefono: tel, etiqueta: 'Celular', principal: !telefonos.length });
    if(error){ alert('No se pudo guardar el teléfono (¿ya estaba cargado?).'); return; }
    await abrirFicha(cliente.id);
  });
  const guardarNota = async () => {
    const texto = document.getElementById('notaTexto').value.trim();
    if(!texto) return;
    await crmAgregarNotaCliente(cliente.id, texto);
    await abrirFicha(cliente.id);
  };
  document.getElementById('btnGuardarNota').addEventListener('click', guardarNota);
  document.getElementById('notaTexto').addEventListener('keydown', e => { if(e.key === 'Enter') guardarNota(); });
}

document.getElementById('buscarCliente').addEventListener('input', renderLista);

/* ===== Tema (lo manda el panel principal) ===== */
const THEME_KEY = 'cm_theme_v2';
function applyTheme(theme){ document.documentElement.setAttribute('data-theme', theme==='dark'?'dark':'light'); }
window.addEventListener('message', e=>{
  if(e.data && e.data.type==='cm-theme') applyTheme(e.data.theme);
  if(e.data && e.data.type==='cm-abrir-cliente' && e.data.id) abrirFicha(e.data.id);
});

/* ===== Auth + carga inicial ===== */
sb.auth.getSession().then(async ({ data: { session } }) => {
  if (!session) { location.href = 'index.html'; return; }
  await crmBootstrap();
  window._markAppReady();
});
sb.auth.onAuthStateChange((_event, session) => { if (!session) location.href = 'index.html'; });

window.appReady.then(async ()=>{
  const saved = await kvGet(THEME_KEY);
  if (saved) applyTheme(saved);
  nombreUsuario = await crmGetNombreUsuario().catch(() => '') || '';
  await cargarLista();
});
</script>
</body>
</html>
