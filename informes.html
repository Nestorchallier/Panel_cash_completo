<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informes — CRM Panel Unificado</title>
<script src="js/embed-guard.js?v=40"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js?v=40"></script>
<script src="supabase/kv.js?v=40"></script>
<script src="js/telefonos.js?v=40"></script>
<script src="supabase/crm.js?v=40"></script>
<script src="js/supervisor-datos.js?v=40"></script>
<style>
  /* Misma paleta que Agenda y Conexión: claro por defecto, oscuro opcional. */
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel-2:#f8fafc; --line:#e2e8f0; --line-2:#f1f5f9;
    --text:#0f172a; --text-2:#334155; --muted:#64748b; --faint:#94a3b8;
    --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#b45309; --chip:#f1f5f9;
    /* Series de los gráficos: recibidos (azul) y enviados (verde). Validadas
       para daltonismo contra el fondo de cada modo. */
    --serie-rec:#2563eb; --serie-env:#16a34a; --banda:#eff6ff; --grilla:#eef2f7;
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --panel:#0f172a; --panel-2:#111c33; --line:#1e293b; --line-2:#162036;
    --text:#e2e8f0; --text-2:#cbd5e1; --muted:#94a3b8; --faint:#64748b;
    --blue:#60a5fa; --green:#22c55e; --red:#f87171; --amber:#fbbf24; --chip:#1e293b;
    --serie-rec:#3b82f6; --serie-env:#16a34a; --banda:#13213d; --grilla:#1a2540;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  header{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel);}
  .head-izq{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .header-sub{font-size:13px;color:var(--muted);}
  main{padding:18px 22px;max-width:1200px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .card + .card, .grilla + .card, .card + .grilla{margin-top:14px;}
  .card h2{font-size:14px;font-weight:700;margin:0 0 2px;}
  .card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .fechas{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;}
  .fecha{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);font-size:13px;color-scheme:light;}
  :root[data-theme="dark"] .fecha{color-scheme:dark;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;}
  .chip.on{background:var(--text);border-color:var(--text);color:var(--bg);}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:600;user-select:none;cursor:pointer;}
  .toggle input{accent-color:var(--blue);width:15px;height:15px;margin:0;}
  .toggle .nota{font-weight:400;color:var(--muted);}
  .espacio{flex:1;}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;}
  .btn:hover{border-color:var(--faint);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-verde{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-verde:hover{filter:brightness(.95);}

  .grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-height:92px;}
  .kpi .k-tit{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;}
  .kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;}
  .kpi .k-val.chico{font-size:21px;}
  .kpi .k-pie{font-size:12px;color:var(--muted);}
  .kpi.alerta .k-val{color:var(--red);}
  .kpi.ok .k-val{color:var(--green);}
  .seccion-tit{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px;}

  .graf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .leyenda{display:flex;gap:14px;font-size:12.5px;color:var(--text-2);flex-wrap:wrap;}
  .leyenda span{display:inline-flex;align-items:center;gap:6px;}
  .leyenda i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .leyenda i.banda{background:var(--banda);border:1px solid var(--line);}
  .graf{position:relative;width:100%;}
  .graf svg{display:block;width:100%;height:auto;overflow:visible;}
  .graf .eje{fill:var(--muted);font-size:11px;font-family:'Inter',system-ui,sans-serif;}
  .graf .grid{stroke:var(--grilla);stroke-width:1;}
  .graf .base{stroke:var(--line);stroke-width:1;}
  .graf .hit{fill:transparent;}
  .graf .hit:hover{fill:var(--line-2);opacity:.6;}
  .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 18px rgba(15,23,42,.14);white-space:nowrap;z-index:5;display:none;}
  .tip b{display:block;margin-bottom:3px;}
  .tip .f{display:flex;align-items:center;gap:6px;color:var(--text-2);}
  .tip .f i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .tip .f em{font-style:normal;font-weight:700;color:var(--text);margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums;}
  details.tabla-datos{margin-top:8px;font-size:12.5px;color:var(--muted);}
  details.tabla-datos summary{cursor:pointer;}
  details.tabla-datos table{margin-top:6px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:9px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  th.num, td.num{text-align:right;font-variant-numeric:tabular-nums;}
  td{padding:10px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle;}
  td.nombre{font-weight:700;}
  td.tel{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--text-2);white-space:nowrap;}
  td.texto{color:var(--text-2);max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  td.hace{white-space:nowrap;color:var(--muted);}
  td.hace.viejo{color:var(--red);font-weight:600;}
  .acciones{white-space:nowrap;text-align:right;}
  .vacio{color:var(--muted);font-size:13px;line-height:1.6;background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;}
  .aviso{background:#fef3c7;color:#854d0e;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;line-height:1.55;margin-bottom:14px;}
  :root[data-theme="dark"] .aviso{background:#3a2f0b;color:#fde68a;border-color:#5c4a12;}
  .cargando{color:var(--muted);padding:30px 0;text-align:center;}
  .ayuda{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px;}
  .ayuda b{color:var(--text-2);}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;z-index:60;}
  .toast.error{background:#b91c1c;}
  @media (max-width:700px){ td.texto, th.col-texto{display:none;} .graf{overflow-x:auto;} .graf svg{min-width:640px;} .tabla-scroll{overflow-x:auto;} td.nombre{white-space:nowrap;} main,header{padding-left:16px;padding-right:16px;} .kpi .k-val{font-size:22px;} }
</style>
</head>
<body>
<header>
  <div class="head-izq">
    <h1>📈 Informes</h1>
    <span class="header-sub">Cómo viene la atención de los chats de WhatsApp</span>
  </div>
  <button class="btn" id="btnExportar" disabled title="Descargar los números de este informe en un CSV (se abre con Excel)">⬇ Exportar</button>
</header>
<main>
  <div class="barra">
    <div class="fechas">
      <input type="date" class="fecha" id="fDesde" aria-label="Desde">
      <span>a</span>
      <input type="date" class="fecha" id="fHasta" aria-label="Hasta">
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-r="hoy">Hoy</button>
      <button class="chip" data-r="ayer">Ayer</button>
      <button class="chip" data-r="7d">7 días</button>
      <button class="chip" data-r="mes">Este mes</button>
    </div>
    <select class="fecha" id="fAgente" aria-label="Agente" hidden><option value="">👥 Todo el equipo</option></select>
    <span class="espacio"></span>
    <label class="toggle" title="Por defecto los grupos de WhatsApp no cuentan: no son chats con clientes"><input type="checkbox" id="chkGrupos"> Incluir grupos</label>
    <label class="toggle" id="lblLaboral"><input type="checkbox" id="chkLaboral"> Solo horario laboral <span class="nota" id="notaLaboral"></span></label>
  </div>
  <div id="avisos"></div>
  <div id="contenido"><div class="cargando">Cargando informe…</div></div>
</main>
<div class="tip" id="tip"></div>

<script>
/* ===== Configuración ===== */
const PAGINA = 1000;        // filas por pedido a Supabase (su máximo por defecto)
const MAX_MENSAJES = 20000; // tope por informe, para no colgar el navegador
const PARALELO = 10;        // consultas chicas a la vez (chats nuevos / respuestas posteriores)
const ESTADOS_RESPUESTA = ['enviado', 'entregado', 'leido']; // un saliente 'pendiente' o con 'error' todavía no es respuesta

let filtro = { desde: '', hasta: '', grupos: false, laboral: false, rapido: 'hoy' };
let datos = null;    // lo que vino de la base para el rango actual
let informe = null;  // los números ya calculados (los usa Exportar)
let sesionWa = null;
let contactosPorTel = {};
let pedidoActual = 0;

/* ===== Modo equipo (Panel de supervisor → 📈 Informes) =====
   Con ?equipo=1 y un supervisor logueado, el informe suma a todos los
   agentes (o al que se elija en el filtro). Es solo lectura: no se crea
   ni se cambia nada. */
const MODO_EQUIPO = new URLSearchParams(location.search).get('equipo') === '1';
let agentesEquipo = []; // [{id, nombre}]
// Los user_id del informe: el propio (o el agente que mira el supervisor), o los del equipo.
async function uidsInforme(){
  if(!MODO_EQUIPO) return [await _uid()];
  const elegido = document.getElementById('fAgente').value;
  return elegido ? [elegido] : agentesEquipo.map(a => a.id);
}

/* ===== Utilidades ===== */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Mismo formato que la Bandeja del WhatsApp CRM.
function telLindo(tel){
  if(!tel) return '—';
  const d = String(tel).replace(/\D/g,'');
  if(/^549\d{10}$/.test(d)){
    const r = d.slice(3);
    if(r.startsWith('11')) return `+54 9 11 ${r.slice(2,6)}-${r.slice(6)}`;
    return `+54 9 ${r.slice(0,3)} ${r.slice(3,6)}-${r.slice(6)}`;
  }
  return (window.formatearTelefonoAR && window.formatearTelefonoAR(d)) || ('+' + d);
}
function toast(texto, tipo){
  const t = document.createElement('div');
  t.className = 'toast' + (tipo === 'error' ? ' error' : '');
  t.textContent = texto;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
const pad = n => String(n).padStart(2, '0');
// Fecha local (no UTC) en formato AAAA-MM-DD: el día "de acá", no el de Greenwich.
function isoLocal(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function sumarDias(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); }
function fechaCorta(iso){ const [a, m, d] = iso.split('-'); return `${d}/${m}`; }
function fechaLarga(iso){ const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; }
const fmtNum = n => Number(n || 0).toLocaleString('es-AR');
const fmtPlata = n => '$ ' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
// Duración legible: "45 s", "12 min", "2 h 05 min", "3 d 4 h".
function fmtDuracion(ms){
  if(ms == null || !isFinite(ms)) return '—';
  const s = Math.round(ms / 1000);
  if(s < 60) return s + ' s';
  const min = Math.round(s / 60);
  if(min < 60) return min + ' min';
  const h = Math.floor(min / 60), rm = min % 60;
  if(h < 24) return `${h} h ${pad(rm)} min`;
  const d = Math.floor(h / 24);
  return `${d} d ${h % 24} h`;
}
function hace(ms){ return ms < 60000 ? 'recién' : 'hace ' + fmtDuracion(ms).replace(/ \d+ s$/, ''); }
const plural = (n, uno, varios) => `${fmtNum(n)} ${n === 1 ? uno : varios}`;
const promedio = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
function mediana(arr){
  if(!arr.length) return null;
  const o = [...arr].sort((a, b) => a - b), m = Math.floor(o.length / 2);
  return o.length % 2 ? o[m] : (o[m - 1] + o[m]) / 2;
}
// Corre fn sobre cada item, de a "n" a la vez (para no mandar 500 pedidos juntos).
async function enTandas(items, n, fn){
  const out = new Array(items.length);
  let i = 0;
  const trabajador = async () => { while(i < items.length){ const k = i++; out[k] = await fn(items[k]); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, trabajador));
  return out;
}

/* ===== Rango de fechas ===== */
function aplicarRapido(r){
  const hoy = isoLocal(new Date());
  filtro.rapido = r;
  if(r === 'hoy'){ filtro.desde = hoy; filtro.hasta = hoy; }
  if(r === 'ayer'){ filtro.desde = filtro.hasta = sumarDias(hoy, -1); }
  if(r === '7d'){ filtro.desde = sumarDias(hoy, -6); filtro.hasta = hoy; }
  if(r === 'mes'){ filtro.desde = hoy.slice(0, 8) + '01'; filtro.hasta = hoy; }
}
function pintarFiltros(){
  document.getElementById('fDesde').value = filtro.desde;
  document.getElementById('fHasta').value = filtro.hasta;
  document.querySelectorAll('#chips .chip').forEach(b => b.classList.toggle('on', b.dataset.r === filtro.rapido));
  document.getElementById('chkGrupos').checked = filtro.grupos;
  document.getElementById('chkLaboral').checked = filtro.laboral;
}
function diasDelRango(){
  const out = [];
  for(let d = filtro.desde; d <= filtro.hasta && out.length < 400; d = sumarDias(d, 1)) out.push(d);
  return out;
}

/* ===== Horario laboral (el mismo que usa el envío automático, en Conexión) ===== */
function horarioTexto(){
  if(!sesionWa) return '';
  return `(${String(sesionWa.horario_desde || '09:00').slice(0,5)} a ${String(sesionWa.horario_hasta || '20:00').slice(0,5)})`;
}
function enHorario(fechaIso){
  if(!filtro.laboral || !sesionWa) return true;
  const d = new Date(fechaIso);
  const dias = sesionWa.dias_habiles || [1, 2, 3, 4, 5, 6];
  if(!dias.includes(d.getDay())) return false;
  const hhmm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return hhmm >= String(sesionWa.horario_desde || '09:00').slice(0, 5) && hhmm <= String(sesionWa.horario_hasta || '20:00').slice(0, 5);
}
function horaEnHorario(h){
  if(!sesionWa) return false;
  const desde = parseInt(String(sesionWa.horario_desde || '09:00').slice(0, 2), 10);
  const hasta = parseInt(String(sesionWa.horario_hasta || '20:00').slice(0, 2), 10);
  return h >= desde && h <= hasta;
}

/* ===== Carga desde Supabase ===== */
async function cargarDatos(){
  const pedido = ++pedidoActual;
  const uids = await uidsInforme();
  const desdeIso = new Date(filtro.desde + 'T00:00:00').toISOString();
  const hastaIso = new Date(filtro.hasta + 'T23:59:59.999').toISOString();

  // 1) Mensajes del rango, de a páginas, con los datos del chat (el !inner
  //    hace que solo vengan los de chats propios, y deja filtrar por grupo).
  const mensajes = [];
  let tope = false, error = null;
  for(let desde = 0; ; desde += PAGINA){
    let q = sb.from('mensajes')
      .select('id, conversacion_id, direccion, tipo, texto, estado, creado_at, conversaciones!inner(id, user_id, es_grupo, telefono, nombre, cliente_id, clientes(nombre))')
      .in('conversaciones.user_id', uids)
      .gte('creado_at', desdeIso).lte('creado_at', hastaIso);
    if(!filtro.grupos) q = q.eq('conversaciones.es_grupo', false);
    const { data, error: e } = await q.order('creado_at', { ascending: true }).order('id', { ascending: true })
      .range(desde, Math.min(desde + PAGINA, MAX_MENSAJES) - 1);
    if(pedido !== pedidoActual) return null; // el usuario cambió el rango mientras cargaba
    if(e){ error = e; break; }
    mensajes.push(...(data || []));
    if(!data || data.length < PAGINA) break;
    if(mensajes.length >= MAX_MENSAJES){ tope = true; break; }
  }
  if(error) throw error;

  const convs = new Map();
  mensajes.forEach(m => { if(!convs.has(m.conversacion_id)) convs.set(m.conversacion_id, m.conversaciones || { id: m.conversacion_id }); });
  const ids = [...convs.keys()];

  // 2) ¿Qué chats ya tenían mensajes antes del rango? Los que no, son "nuevos".
  //    Una consulta mínima por chat (limit 1): no se puede pedir "distinct".
  const conPrevios = new Set();
  await enTandas(ids, PARALELO, async id => {
    const { data } = await sb.from('mensajes').select('id').eq('conversacion_id', id).lt('creado_at', desdeIso).limit(1);
    if(data && data.length) conPrevios.add(id);
  });

  // 3) Chats cuyo último mensaje del rango es del cliente: ¿se le contestó
  //    DESPUÉS del rango? (Ej: el informe de ayer, contestado hoy a la mañana.)
  const respuestaPosterior = new Map();
  if(hastaIso < new Date().toISOString()){
    const ultimo = new Map();
    mensajes.forEach(m => ultimo.set(m.conversacion_id, m));
    const pendientes = ids.filter(id => ultimo.get(id).direccion === 'entrante');
    await enTandas(pendientes, PARALELO, async id => {
      const { data } = await sb.from('mensajes').select('creado_at').eq('conversacion_id', id)
        .eq('direccion', 'saliente').in('estado', ESTADOS_RESPUESTA).gt('creado_at', hastaIso)
        .order('creado_at', { ascending: true }).limit(1);
      if(data && data.length) respuestaPosterior.set(id, data[0].creado_at);
    });
  }

  // 4) Pagos (fecha es un día, sin hora) y promesas registradas en el rango.
  const [rPagos, rPromesas] = await Promise.all([
    sb.from('pagos').select('id, monto, fecha, estado').in('user_id', uids).gte('fecha', filtro.desde).lte('fecha', filtro.hasta),
    sb.from('eventos').select('id, cliente_id, creado_at').in('user_id', uids).eq('tipo', 'promesa').gte('creado_at', desdeIso).lte('creado_at', hastaIso),
  ]);
  if(rPagos.error) console.error('informes pagos', rPagos.error);
  if(rPromesas.error) console.error('informes promesas', rPromesas.error);
  if(pedido !== pedidoActual) return null;

  return {
    mensajes, convs, conPrevios, respuestaPosterior, tope,
    pagos: rPagos.error ? null : (rPagos.data || []),
    promesas: rPromesas.error ? null : (rPromesas.data || []),
  };
}

/* ===== Cálculo de los números ===== */
function nombreChat(c){
  if(!c) return 'Chat';
  if(c.es_grupo) return c.nombre || 'Grupo';
  if(c.clientes && c.clientes.nombre) return c.clientes.nombre;
  const ag = c.telefono && contactosPorTel[c.telefono];
  if(ag) return ag.nombre;
  return c.nombre || telLindo(c.telefono);
}
function textoMensaje(m){
  if(m.texto) return m.texto;
  return { imagen: '📷 Imagen', pdf: '📄 PDF', audio: '🎤 Audio' }[m.tipo] || 'Mensaje';
}

function calcular(){
  const { mensajes, convs, conPrevios, respuestaPosterior } = datos;
  const ahora = Date.now();
  const esRespuesta = m => m.direccion === 'saliente' && ESTADOS_RESPUESTA.includes(m.estado);

  // Todos los mensajes del rango por chat (para buscar respuestas se usan
  // todos, aunque el horario laboral esté activo: una respuesta a las 21 h
  // igual es respuesta).
  const porChat = new Map();
  mensajes.forEach(m => { if(!porChat.has(m.conversacion_id)) porChat.set(m.conversacion_id, []); porChat.get(m.conversacion_id).push(m); });
  // Cuándo se le contestó a un entrante: el primer saliente válido posterior.
  function respuestaA(lista, idx){
    for(let j = idx + 1; j < lista.length; j++) if(esRespuesta(lista[j])) return lista[j].creado_at;
    return respuestaPosterior.get(lista[idx].conversacion_id) || null;
  }

  const visibles = mensajes.filter(m => enHorario(m.creado_at));
  const porHora = Array.from({ length: 24 }, () => ({ rec: 0, env: 0 }));
  const dias = diasDelRango();
  const porDia = Object.fromEntries(dias.map(d => [d, { rec: 0, env: 0 }]));
  let recibidos = 0, enviados = 0, conError = 0, enCola = 0;
  const activos = new Set();
  visibles.forEach(m => {
    activos.add(m.conversacion_id);
    const f = new Date(m.creado_at), h = f.getHours(), d = isoLocal(f);
    if(m.direccion === 'entrante'){
      recibidos++; porHora[h].rec++; if(porDia[d]) porDia[d].rec++;
    } else if(m.estado === 'error'){
      conError++;
    } else {
      enviados++; porHora[h].env++; if(porDia[d]) porDia[d].env++;
      if(m.estado === 'pendiente') enCola++;
    }
  });

  const nuevos = [...activos].filter(id => !conPrevios.has(id)).length;
  const tiemposPrimera = [];
  const sinRespuesta = [];
  let conEntrantes = 0, respondidos = 0;
  porChat.forEach((lista, id) => {
    let primera = -1, ultima = -1;
    lista.forEach((m, i) => {
      if(m.direccion !== 'entrante' || !enHorario(m.creado_at)) return;
      if(primera < 0) primera = i;
      ultima = i;
    });
    if(primera < 0) return;
    conEntrantes++;
    const r1 = respuestaA(lista, primera);
    if(r1) tiemposPrimera.push(new Date(r1) - new Date(lista[primera].creado_at));
    if(respuestaA(lista, ultima)) respondidos++;
    else {
      const m = lista[ultima], c = convs.get(id) || {};
      sinRespuesta.push({ id, nombre: nombreChat(c), telefono: c.telefono || '', esGrupo: !!c.es_grupo, texto: textoMensaje(m), at: m.creado_at, espera: ahora - new Date(m.creado_at) });
    }
  });
  sinRespuesta.sort((a, b) => b.espera - a.espera);

  const pagos = datos.pagos, promesas = datos.promesas;
  return {
    desde: filtro.desde, hasta: filtro.hasta, dias, porHora, porDia,
    chatsActivos: activos.size, nuevos, recibidos, enviados, conError, enCola,
    conEntrantes, respondidos, sinRespuesta,
    primeraProm: promedio(tiemposPrimera), primeraMed: mediana(tiemposPrimera), primeraN: tiemposPrimera.length,
    pagosN: pagos ? pagos.length : null,
    pagosTotal: pagos ? pagos.reduce((s, p) => s + (Number(p.monto) || 0), 0) : null,
    pagosCobrado: pagos ? pagos.filter(p => p.estado === 'Cobrado').reduce((s, p) => s + (Number(p.monto) || 0), 0) : null,
    promesasN: promesas ? promesas.length : null,
    promesasClientes: promesas ? new Set(promesas.map(p => p.cliente_id)).size : null,
  };
}

/* ===== Gráfico de barras agrupadas (SVG simple, sin librerías) ===== */
// filas: [{ etiqueta, tip, rec, env, banda }]
function graficoBarras(filas, opciones){
  const W = 960, H = 230, mIzq = 34, mDer = 8, mArr = 10, mAba = 26;
  const anchoUtil = W - mIzq - mDer, altoUtil = H - mArr - mAba;
  const max = Math.max(1, ...filas.map(f => Math.max(f.rec, f.env)));
  // Escala "redonda" para el eje: 1, 2, 5, 10, 20, 50...
  const paso = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000].find(p => max / p <= 4) || Math.ceil(max / 4);
  const tope = Math.ceil(max / paso) * paso;
  const y = v => mArr + altoUtil - (v / tope) * altoUtil;
  const col = anchoUtil / filas.length;
  const anchoBarra = Math.max(2, Math.min(16, (col - 6) / 2 - 1));
  const cada = opciones.cadaEtiqueta || 1;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(opciones.titulo)}">`;
  // Franja del horario laboral: un solo rectángulo por tramo seguido (si no, se ven las uniones).
  for(let i = 0; i < filas.length; i++){
    if(!filas[i].banda) continue;
    let j = i; while(j + 1 < filas.length && filas[j + 1].banda) j++;
    svg += `<rect x="${mIzq + i * col}" y="${mArr}" width="${(j - i + 1) * col}" height="${altoUtil}" fill="var(--banda)"/>`;
    i = j;
  }
  for(let v = 0; v <= tope; v += paso){
    svg += `<line class="${v ? 'grid' : 'base'}" x1="${mIzq}" x2="${W - mDer}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="eje" x="${mIzq - 6}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  }
  // Barra con la punta de arriba redondeada y la base recta, apoyada en el eje.
  const barra = (x, v, color) => {
    if(!v) return '';
    const yTop = y(v), alto = mArr + altoUtil - yTop, r = Math.min(4, anchoBarra / 2, alto);
    return `<path d="M${x},${mArr + altoUtil} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + anchoBarra - r} Q${x + anchoBarra},${yTop} ${x + anchoBarra},${yTop + r} V${mArr + altoUtil} Z" fill="${color}" pointer-events="none"/>`;
  };
  // Zonas para el mouse (una por columna), debajo de las barras para que el resaltado no las tape.
  filas.forEach((f, i) => {
    svg += `<rect class="hit" data-i="${i}" x="${mIzq + i * col}" y="${mArr}" width="${col}" height="${altoUtil + mAba}"/>`;
  });
  filas.forEach((f, i) => {
    const centro = mIzq + i * col + col / 2;
    svg += barra(centro - anchoBarra - 1, f.rec, 'var(--serie-rec)');
    svg += barra(centro + 1, f.env, 'var(--serie-env)');
    if(i % cada === 0) svg += `<text class="eje" pointer-events="none" x="${centro}" y="${H - 8}" text-anchor="middle">${escapeHtml(f.etiqueta)}</text>`;
  });
  return svg + '</svg>';
}
function conectarTooltip(contenedor, filas){
  const tip = document.getElementById('tip');
  contenedor.addEventListener('mousemove', e => {
    const r = e.target.closest('.hit');
    if(!r){ tip.style.display = 'none'; return; }
    const f = filas[+r.dataset.i];
    tip.innerHTML = `<b>${escapeHtml(f.tip)}</b>
      <div class="f"><i style="background:var(--serie-rec)"></i>Recibidos<em>${fmtNum(f.rec)}</em></div>
      <div class="f"><i style="background:var(--serie-env)"></i>Enviados<em>${fmtNum(f.env)}</em></div>`;
    tip.style.display = 'block';
    const x = Math.min(e.pageX + 14, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = (e.pageY - tip.offsetHeight - 12) + 'px';
  });
  contenedor.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}
function tablaDatos(filas, colTit){
  return `<details class="tabla-datos"><summary>Ver como tabla</summary><table><thead><tr><th>${colTit}</th><th class="num">Recibidos</th><th class="num">Enviados</th></tr></thead><tbody>
    ${filas.filter(f => f.rec || f.env).map(f => `<tr><td>${escapeHtml(f.tip)}</td><td class="num">${fmtNum(f.rec)}</td><td class="num">${fmtNum(f.env)}</td></tr>`).join('') || '<tr><td colspan="3">Sin mensajes.</td></tr>'}
  </tbody></table></details>`;
}

}

      ${kpi('✅ Respondidos', fmtNum(I.respondidos), `${pct(I.respondidos, I.conEntrantes)} de los chats que escribieron`, 'ok', 'Chats que escribieron en el rango y al último mensaje del cliente se le contestó (en el rango o después).')}
      ${kpi('⏳ Sin respuesta', fmtNum(sinResp.length), sinResp.length ? 'el cliente espera respuesta' : 'nadie esperando', sinResp.length ? 'alerta' : '', 'Chats cuyo último mensaje del cliente en el rango todavía no tiene respuesta.')}
    </div>
    <div class="seccion-tit">Tiempos y gestión</div>
    <div class="grilla">
      ${kpi('⚡ Primera respuesta (promedio)', fmtDuracion(I.primeraProm), I.primeraN ? `en ${plural(I.primeraN, 'chat contestado', 'chats contestados')}` : 'todavía sin respuestas', '', 'Desde el primer mensaje del cliente en el rango hasta la primera respuesta enviada.')}
      ${kpi('⏱️ Primera respuesta (mediana)', fmtDuracion(I.primeraMed), 'la mitad se contestó en menos', '', 'La mitad de los chats se contestó en menos de este tiempo: no la desvían los casos raros.')}
      ${kpi('💵 Pagos registrados', I.pagosN == null ? '—' : fmtNum(I.pagosN), I.pagosN == null ? 'no se pudieron leer' : `${fmtPlata(I.pagosTotal)}${I.pagosCobrado !== I.pagosTotal ? ` · ${fmtPlata(I.pagosCobrado)} cobrado` : ''}`, '', 'Pagos de la tabla pagos con fecha dentro del rango.')}
      ${kpi('🤝 Promesas de pago', I.promesasN == null ? '—' : fmtNum(I.promesasN), I.promesasN == null ? 'no se pudieron leer' : `de ${plural(I.promesasClientes, 'cliente', 'clientes')}`, '', 'Promesas cargadas en el rango (a mano o detectadas por las reglas).')}

        ${sinResp.map(s => `<tr>
          <td class="nombre">${s.esGrupo ? '👥 ' : ''}${escapeHtml(s.nombre)}</td>
          <td class="tel">${escapeHtml(s.telefono ? telLindo(s.telefono) : '—')}</td>
          <td class="texto" title="${escapeHtml(s.texto)}">${escapeHtml(s.texto)}</td>
          <td class="hace ${s.espera > 3600000 ? 'viejo' : ''}" title="${escapeHtml(new Date(s.at).toLocaleString('es-AR'))}">${hace(s.espera)}</td>
          <td class="acciones">${s.telefono ? `<button class="btn" data-chat="${escapeHtml(s.telefono)}" title="Abrir el chat en el WhatsApp CRM">💬 Abrir chat</button>` : ''}</td>

    </div>

    <div class="ayuda">
      <b>Cómo se cuenta:</b> ${filtro.grupos ? 'incluye los grupos de WhatsApp' : 'no cuenta los grupos de WhatsApp'}${filtro.laboral && sesionWa ? `; solo mensajes en horario laboral ${horarioTexto()}` : ''}.
      Un mensaje enviado cuenta como respuesta cuando ya salió (enviado, entregado o leído): los que están en cola o con error no.
      Si al cliente se le contestó después del rango (por ejemplo, el informe de ayer contestado hoy), cuenta como respondido.
    </div>`;

  conectarTooltip(document.getElementById('grafHora'), filasHora);
  if(!unDia) conectarTooltip(document.getElementById('grafDia'), filasDia);
  document.getElementById('btnExportar').disabled = false;
}

async function actualizar(){
  pintarFiltros();
  if(!filtro.desde || !filtro.hasta) return;
  if(filtro.desde > filtro.hasta){ const t = filtro.desde; filtro.desde = filtro.hasta; filtro.hasta = t; pintarFiltros(); }
  document.getElementById('btnExportar').disabled = true;
  document.getElementById('contenido').innerHTML = '<div class="cargando">Cargando informe…</div>';
  try{
    const d = await cargarDatos();
    if(!d) return; // quedó viejo: ya hay otro pedido en curso
    datos = d;
    render();
  }catch(e){
    console.error('informes', e);
    document.getElementById('contenido').innerHTML = `<div class="vacio">No se pudo armar el informe. Revisá la conexión y probá de nuevo.<br><button class="btn" id="btnReintentar" style="margin-top:10px">↻ Reintentar</button></div>`;
    document.getElementById('btnReintentar').addEventListener('click', actualizar);
  }
}

/* ===== Exportar CSV (separado por ";" para que Excel en castellano lo abra bien) ===== */
function exportar(){
  if(!informe) return;
  const I = informe;
  const celda = v => { const s = v == null ? '' : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const minutos = ms => ms == null ? '' : (ms / 60000).toFixed(1).replace('.', ',');
  const filas = [
    ['Informe de chats', `${fechaLarga(I.desde)} al ${fechaLarga(I.hasta)}`],
    ['Grupos', filtro.grupos ? 'incluidos' : 'excluidos'],
    ['Horario laboral', filtro.laboral && sesionWa ? 'solo ' + horarioTexto() : 'todo el día'],
    [],
    ['Métrica', 'Valor'],
    ['Chats con actividad', I.chatsActivos],
    ['Chats nuevos', I.nuevos],
    ['Mensajes recibidos', I.recibidos],
    ['Mensajes enviados', I.enviados],
    ['Mensajes con error', I.conError],
    ['Chats que escribieron', I.conEntrantes],
    ['Respondidos', I.respondidos],
    ['Sin respuesta', I.sinRespuesta.length],
    ['Primera respuesta promedio (min)', minutos(I.primeraProm)],
    ['Primera respuesta mediana (min)', minutos(I.primeraMed)],
    ['Pagos registrados', I.pagosN == null ? '' : I.pagosN],
    ['Pagos monto total', I.pagosTotal == null ? '' : I.pagosTotal],
    ['Promesas de pago', I.promesasN == null ? '' : I.promesasN],
    [],
    ['Hora', 'Recibidos', 'Enviados'],
    ...I.porHora.map((v, h) => [`${pad(h)}:00`, v.rec, v.env]),
  ];
  if(I.dias.length > 1){
    filas.push([], ['Día', 'Recibidos', 'Enviados'], ...I.dias.map(d => [fechaLarga(d), I.porDia[d].rec, I.porDia[d].env]));
  }
  if(I.sinRespuesta.length){
    filas.push([], ['Sin respuesta: chat', 'Teléfono', 'Último mensaje', 'Fecha']);
    I.sinRespuesta.forEach(s => filas.push([s.nombre, s.telefono, s.texto, new Date(s.at).toLocaleString('es-AR')]));
  }
  const csv = '﻿' + filas.map(f => f.map(celda).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `informe_${I.desde}${I.desde === I.hasta ? '' : '_a_' + I.hasta}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('⬇ Informe descargado');
}

    const [sesion, contactos] = await Promise.all([crmGetWaSesion(), crmListContactos()]);
    sesionWa = sesion;
    contactos.forEach(c => { if(c.telefono) contactosPorTel[c.telefono] = c; });
  }catch(e){ console.error('informes', e); }
  document.getElementById('notaLaboral').textContent = horarioTexto();
  await actualizar();
});
</script>
