<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp CRM — CRM Panel Unificado</title>
<script src="js/embed-guard.js"></script>
<link rel="stylesheet" href="css/fuentes.css">
<!-- Emojis a color como los del render del plan (los de Windows se ven
     distintos y más chicos). Solo baja los emojis que aparecen en pantalla. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="supabase/kv.js"></script>
<script src="js/telefonos.js"></script>
<script src="js/mora.js"></script>
<script src="supabase/crm.js"></script>
<style>
  /* Paleta del plan (sección 5.1 del PDF): fondo claro, tarjetas blancas
     con borde suave, chat estilo WhatsApp y etiquetas pastel. El modo
     oscuro es la misma estructura con los tonos invertidos. */

    --aviso-bg:#fef9c3; --aviso-line:#fde68a; --aviso-text:#854d0e;
    --chip-bg:#fef3c7; --chip-text:#92400e;
    --adj-bg:linear-gradient(180deg,#eff6ff 0%,#e0f2fe 100%); --adj-line:#dbeafe;
    --tilde:#8696a0; --tilde-leido:#53bdeb;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow:0 10px 30px rgba(15,23,42,.12);
    --tab-active-bg:#0f172a; --tab-active-text:#ffffff;
    --fondo-modal:rgba(15,23,42,.45);
  }

    --shadow-sm:none; --shadow:0 10px 30px rgba(0,0,0,.5);

  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  /* Los emojis van con Noto Color Emoji (como el render) y el texto con
     Inter; Segoe UI queda antes del emoji para que los números y letras
     nunca salgan de la fuente de emojis si Inter tarda en cargar. */
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif,'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji';
    font-size:13px;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{font-family:inherit;}

  /* ── Encabezado ── */
  header{
    height:57px; padding:0 22px; display:flex; align-items:center; justify-content:space-between; gap:14px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;
  }
  .header-title{display:flex;align-items:baseline;gap:14px;min-width:0;white-space:nowrap;}
  header h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .header-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
  .header-tools{display:flex;align-items:center;gap:14px;}
  .wa-search{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;height:32px;padding:0 10px;width:300px;}
  .wa-search span{font-size:12px;}
  .wa-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
  .wa-search input::placeholder{color:var(--faint);}
  .wa-search:focus-within{border-color:var(--blue);}
  .btn{border-radius:8px;height:32px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:4px;}
  .btn:hover{border-color:var(--faint);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-verde{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
  .btn-verde:hover{background:var(--green-hover);border-color:var(--green-hover);}

  .wa-crm{flex:1;display:flex;min-height:0;}

  /* ── Lista de chats ── */
  .wa-chats{width:340px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);}
  .wa-chats-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;}
  .filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  /* Como en el render: "Etapa: Todas ▾" con la flechita pegada al texto.
     El <select> real queda invisible encima, así el desplegable sigue
     siendo el nativo (anda con teclado y en el celular). */
  .filtro-pill{position:relative;display:flex;align-items:center;height:31px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;cursor:pointer;}
  .filtro-pill:hover{border-color:var(--faint);}
  .filtro-pill .txt{overflow:hidden;text-overflow:ellipsis;}
  .filtro-pill .flecha{margin-left:3px;font-size:11px;}
  .filtro-pill select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:13px;}
  .filtro-pill.activo{border-color:var(--blue);color:var(--blue);}
  .wa-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .wa-tabs button{background:var(--line-2);border:none;color:var(--text-2);border-radius:6px;height:22px;padding:0 8px;font-size:12px;font-weight:600;cursor:pointer;}
  .wa-tabs button.active{background:var(--tab-active-bg);color:var(--tab-active-text);}
  #chatList{flex:1;overflow-y:auto;}
  .chat-item{padding:11px 14px 11px 11px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;cursor:pointer;align-items:flex-start;border-left:3px solid transparent;}
  .chat-item:hover{background:var(--panel-2);}
  .chat-item.active{background:var(--blue-50);border-left-color:var(--blue);}
  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;margin-top:1px;}
  .chat-info{flex:1;min-width:0;}
  .chat-info .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .chat-info .nombre{font-weight:700;font-size:14px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-info .hora{font-size:12px;color:var(--faint);flex-shrink:0;}
  .chat-info .hora.nuevo{color:var(--green);}
  .chat-info .row2{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:1px;min-height:18px;}
  .chat-info .preview{font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .no-leidos{background:var(--green);color:#fff;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .chat-tags:empty{display:none;}

  /* Etiquetas pastel (mismas en lista, ficha y Kanban) */
  .tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:16px;font-weight:600;padding:0 6px;border-radius:4px;white-space:nowrap;background:#f1f5f9;color:#475569;}
  .tag.azul{background:#dbeafe;color:#1d4ed8;}
  .tag.verde{background:#dcfce7;color:#15803d;}
  .tag.ambar{background:#fef3c7;color:#b45309;}
  .tag.rojo{background:#fee2e2;color:#b91c1c;}
  .tag.violeta{background:#ede9fe;color:#6d28d9;}
  .tag.cian{background:#cffafe;color:#0e7490;}
  .tag.gris{background:#f1f5f9;color:#475569;}
  :root[data-theme="dark"] .tag{filter:saturate(.9) brightness(.92);}

  /* ── Conversación ── */
  .wa-conv{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel);}
  .conv-head{height:58px;flex-shrink:0;padding:0 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);}
  .conv-head-id{display:flex;align-items:center;gap:12px;min-width:0;}
  .conv-head .avatar{width:38px;height:38px;margin:0;}
  .conv-head .nombre{font-weight:700;font-size:15px;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-head .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-head-tools{display:flex;gap:12px;align-items:center;flex-shrink:0;}
  .conv-head-tools .btn{height:30px;padding:0 12px;}
  .pill-usuario{cursor:default;}
  .pill-usuario:hover{border-color:var(--line);}
  .btn-cuadrado{width:38px;padding:0 !important;font-size:15px;letter-spacing:1px;}
  #convMessages{flex:1;overflow-y:auto;padding:12px 30px 16px;display:flex;flex-direction:column;gap:7px;
    background-color:var(--chat-bg);
    background-image:var(--chat-fondo);
    background-size:240px 240px;}
  .bubble{max-width:62%;padding:8px 10px 6px;border-radius:8px;font-size:14px;line-height:1.3;position:relative;box-shadow:0 1px .5px rgba(11,20,26,.10);overflow-wrap:anywhere;color:var(--text);}
  .bubble.entrante{align-self:flex-start;background:var(--bubble-in);}
  .bubble.saliente{align-self:flex-end;background:var(--bubble-out);}
  .bubble .txt{white-space:pre-wrap;}
  .bubble .txt a{color:var(--blue);}
  .bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--faint);margin-top:4px;white-space:nowrap;line-height:14px;}
  :root[data-theme="dark"] .bubble .meta{color:#8696a0;}
  .bubble .autor{font-size:11px;color:var(--blue);font-weight:700;margin-bottom:3px;}
  /* Tildes como los de WhatsApp: gris = enviado/entregado, celeste = leído. */
  .btn-refi-apto{display:block;width:100%;margin-top:12px;padding:9px 10px;border-radius:8px;border:1px solid #67e8f9;background:#ecfeff;color:#0e7490;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn-refi-apto:hover{background:#cffafe;}
  .tilde{display:inline-flex;align-items:center;color:var(--tilde);}

<body>

<header>
  <div class="header-title">
    <h1>💬 WhatsApp CRM</h1>

  </div>

    <button class="btn btn-verde" id="btnNuevoChat">+ Nuevo chat</button>
  </div>

  <aside class="wa-chats">

      <div class="filtros">
        <label class="filtro-pill" id="pillEtapa"><span class="txt" id="txtEtapa">Etapa: Todas</span><span class="flecha">▾</span>
          <select id="filtroEtapa" aria-label="Filtrar por etapa"><option value="">Todas</option></select></label>
        <label class="filtro-pill" id="pillCobrador"><span class="txt" id="txtCobrador">Cobrador: Todos</span><span class="flecha">▾</span>
          <select id="filtroCobrador" aria-label="Filtrar por cobrador"><option value="">Todos</option></select></label>

        <button class="active" data-filtro="todos">Todos <span id="nTodos"></span></button>

      <div style="font-size:34px;">💬</div>

    </div>

  <aside class="wa-ficha" id="fichaLateral"></aside>
</div>

<div class="toast" id="toast"></div>

<script>
let conversaciones = [];
let conversacionActual = null;
let mensajesActuales = [];
// Agenda de no clientes (equipo, gerencia): por teléfono normalizado.
let contactosPorTel = {};
const GRUPOS_AGENDA = { equipo: '👔 Equipo', gerencia: '🏢 Gerencia', otro: '📇 Agenda' };
function contactoDe(c){ return (!c.es_grupo && !c.cliente_id && c.telefono && contactosPorTel[c.telefono]) || null; }
function sinVincularReal(c){ return !c.cliente_id && !c.es_grupo && !contactoDe(c); }
async function cargarContactos(){
  const lista = await crmListContactos();
  contactosPorTel = {};
  lista.forEach(x => { if(x.telefono) contactosPorTel[x.telefono] = x; });
}
// Mensajes que no se pudieron dejar en la cola (sin internet, sesión
// vencida): quedan en el chat con "Reintentar" en vez de desaparecer en la
// próxima recarga. Por conversación, solo en esta pestaña.
const noGuardados = new Map();
function conNoGuardados(convId, lista){ return [...lista, ...(noGuardados.get(convId) || [])]; }
let eventosActuales = [];
let fichaActual = null;
let etapasCache = [];
let plantillasCache = {};
let reglasCache = [];
let resumenPrestamosCache = {};
let filtroActivo = 'todos';
let canalMensajes = null;
let nombreUsuarioCache = '';

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iniciales(nombre){
  const s = String(nombre||'').trim();
  if(!s || /^[+\d\s()-]+$/.test(s)) return '?';
  const partes = s.replace(/^~\s*/, '').split(/\s+/);
  return (((partes[0]||'')[0]||'') + ((partes[1]||'')[0]||'')).toUpperCase() || '?';
}
// "nestor.challier" -> "Nestor C." (como en los globos y el encabezado del render).
function nombreCorto(n){ return (window.crmNombreCorto ? window.crmNombreCorto(n) : n) || ''; }
// Mismos tonos que los avatares del plan (rosa, cian, violeta, naranja...).
// Sale del nombre y no de la posición en la lista, así cada cliente
// conserva siempre su color aunque la lista se reordene.
const AVATAR_PALETTE = ['#db2777','#0891b2','#7c3aed','#ea580c','#16a34a','#dc2626','#ca8a04','#2563eb'];
function colorParaNombre(nombre){
  if(iniciales(nombre) === '?') return '#64748b';
  let hash = 0;
  const s = String(nombre||'');
  for(let i=0;i<s.length;i++) hash = (hash*31 + s.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(hash)];
}
function fmtPesos(n){ return '$' + Math.round(Number(n)||0).toLocaleString('es-AR'); }
function fmtFecha(iso){
  if(!iso) return '—';
  const [y,m,d] = String(iso).slice(0,10).split('-');
  return `${d}/${m}/${y}`;
}
// 3.39 -> "3,4"; 5 -> "5" (cuotas pagas con fracción, como pide el plan).
function fmtDecimal(n){
  const v = Math.round((Number(n)||0) * 10) / 10;
  return v.toLocaleString('es-AR', { maximumFractionDigits: 1 });
}
// "32145678" -> "32.145.678" (como en el render).
function fmtDni(dni){
  const s = String(dni||'').trim();
  return /^\d{7,8}$/.test(s) ? Number(s).toLocaleString('es-AR') : s;
}
// "5491162038841" -> "+54 9 11 6203-8841" (como en el render). Para Buenos
// Aires (11) el corte es exacto; para el resto se asume código de área de 3
// cifras (Córdoba, Rosario, La Plata...), que es lo más común en la cartera.
// Si no es un celular argentino se usa el formato general de telefonos.js.
function telefonoLindo(tel){
  const d = String(tel||'').replace(/\D/g,'');
  if(/^549\d{10}$/.test(d)){
    const r = d.slice(3);
    if(r.startsWith('11')) return `+54 9 11 ${r.slice(2,6)}-${r.slice(6)}`;
    return `+54 9 ${r.slice(0,3)} ${r.slice(3,6)}-${r.slice(6)}`;
  }
  return (window.formatearTelefonoAR && d && window.formatearTelefonoAR(d)) || tel || '';
}
function hoyISO(){ return window.CMMora ? window.CMMora.hoyISO() : new Date().toISOString().slice(0,10); }
function diasHasta(iso){
  if(!iso) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(String(iso).slice(0,10) + 'T00:00:00');
  return Math.round((f - hoy) / 86400000);
}
function horaCorta(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const hoy = new Date();
  if(d.toDateString() === hoy.toDateString()) return d.toTimeString().slice(0,5);
  const ayer = new Date(Date.now() - 86400000);
  if(d.toDateString() === ayer.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'});
}
function horaMensaje(iso){ return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}); }

// Formato de WhatsApp: *negrita*, _cursiva_, ~tachado~ y links (en el render
// el "$86.400" y el alias salen en negrita porque el mensaje los marca así).
function formatoWA(texto){
  let s = escapeHtml(texto);
  s = s.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const borde = '(?=$|[\\s.,;:!?¡¿)\\]"\'])';
  s = s.replace(new RegExp('(^|[\\s(¡¿])\\*([^*\\n]+?)\\*' + borde, 'g'), '$1<b>$2</b>');
  s = s.replace(new RegExp('(^|[\\s(¡¿])_([^_\\n]+?)_' + borde, 'g'), '$1<i>$2</i>');
  s = s.replace(new RegExp('(^|[\\s(¡¿])~([^~\\n]+?)~' + borde, 'g'), '$1<s>$2</s>');
  return s;
}

function toast(texto, tipo){
  const t = document.getElementById('toast');
  t.textContent = texto;
  t.className = 'toast visible' + (tipo === 'error' ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast'; }, 4200);
}

// Etapa del Kanban -> etiqueta de color + emoji (como en el render 5.1).
const ESTILO_ETAPA = {
  a_contactar:    { cls:'gris',    emoji:'⚪' },
  contactado:     { cls:'azul',    emoji:'🔵' },
  promesa:        { cls:'ambar',   emoji:'🤝' },
  verificar_pago: { cls:'violeta', emoji:'🟡' },
  refinanciado:   { cls:'cian',    emoji:'🔁' },
  cerrado:        { cls:'verde',   emoji:'✅' },
};
const ESTILO_ETIQUETA = {
  'reclamo':          { cls:'rojo',    emoji:'⚠️' },
  'comprobante':      { cls:'violeta', emoji:'📎' },
  'pide refinanciar': { cls:'cian',    emoji:'🔁' },
  'consulta':         { cls:'gris',    emoji:'❓' },
  'cancelado':        { cls:'verde',   emoji:'✅' },
};
function etapaPorRowId(rowId){ return etapasCache.find(e => e._rowId === rowId) || null; }
function emojiEtiqueta(texto){ const est = ESTILO_ETIQUETA[String(texto).toLowerCase()]; return est ? est.emoji + ' ' : ''; }
function tagEtiqueta(texto){
  const est = ESTILO_ETIQUETA[String(texto).toLowerCase()] || { cls:'gris', emoji:'' };
  return `<span class="tag ${est.cls}">${est.emoji ? est.emoji + ' ' : ''}${escapeHtml(texto)}</span>`;
}
function diaSemanaCorto(iso){
  const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
  return ['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
function tieneEtiqueta(cli, nombre){ return ((cli && cli.etiquetas) || []).some(e => String(e).toLowerCase() === nombre); }
// Préstamo saldado: lo dice el resumen (estado 'cancelado') o la etiqueta
// "Cancelado" que pone "Confirmar pago" cuando se paga todo.
function estaCancelado(c){
  const p = resumenPrestamosCache[c.cliente_id];
  return (p && p.estado === 'cancelado') || tieneEtiqueta(c.clientes, 'cancelado');
}
function tagsDeChat(c){
  if(c.es_grupo) return `<span class="tag gris">👥 Grupo</span>`;
  const contacto = contactoDe(c);
  if(contacto) return `<span class="tag azul">${GRUPOS_AGENDA[contacto.grupo] || GRUPOS_AGENDA.otro}${contacto.cargo ? ' · ' + escapeHtml(contacto.cargo) : ''}</span>`;
  if(!c.cliente_id) return `<span class="tag gris">❓ Sin cliente vinculado</span>`;
  if(estaCancelado(c)) return `<span class="tag verde">✅ Cancelado</span>`;
  const out = [];
  const cli = c.clientes || {};
  const etapa = etapaPorRowId(cli.etapa_id);
  const etiquetas = (cli.etiquetas || []).filter(e => String(e).toLowerCase() !== 'cancelado');
  // Como en el render: la promesa (con su fecha) y el cerrado siempre se
  // ven; si no, manda la etiqueta de la regla (Comprobante, Reclamo...) y
  // solo si no hay ninguna se muestra la etapa.
  if(etapa && etapa.id === 'promesa' && cli.promesa_fecha){
    out.push(`<span class="tag ambar">🤝 Promesa · ${diaSemanaCorto(cli.promesa_fecha)}</span>`);
  } else if(etapa && etapa.id === 'cerrado'){
    out.push(`<span class="tag verde">✅ ${escapeHtml(etapa.name)}</span>`);
  } else if(etiquetas.length){
    etiquetas.slice(0, 2).forEach(e => out.push(tagEtiqueta(e)));
  } else if(etapa && etapa.id !== 'a_contactar'){
    const est = ESTILO_ETAPA[etapa.id] || { cls:'gris' };
    out.push(`<span class="tag ${est.cls}">${escapeHtml(etapa.name)}</span>`);
  }
  const prestamo = resumenPrestamosCache[c.cliente_id];
  if(prestamo && prestamo.dias_atraso > 0 && !(etapa && etapa.id === 'cerrado')){
    out.push(`<span class="tag rojo">Atraso ${prestamo.dias_atraso} d</span>`);
  }
  return out.join('');
}

function nombreConversacion(c){
  if(c.es_grupo) return c.nombre || 'Grupo';
  if(c.clientes && c.clientes.nombre) return c.clientes.nombre;
  const contacto = contactoDe(c);
  if(contacto) return contacto.nombre;
  return (c.telefono && telefonoLindo(c.telefono)) || c.nombre || 'Contacto sin agendar';
}

function pasaFiltroBase(c){
  const etapaSel = document.getElementById('filtroEtapa').value;
  if(etapaSel){
    const etapaId = c.clientes ? c.clientes.etapa_id : null;
    if(etapaId !== etapaSel) return false;
  }
  const cobSel = document.getElementById('filtroCobrador').value;
  if(cobSel){
    const cob = (c.clientes && c.clientes.cobrador_nombre) || '';
    if(cobSel === '__sin' ? !!cob : cob !== cobSel) return false;
  }
  const q = document.getElementById('buscarChat').value.trim().toLowerCase();
  if(!q) return true;
  const nombre = nombreConversacion(c).toLowerCase();
  const dni = (c.clientes && c.clientes.dni || '').toLowerCase();
  const nro = String((resumenPrestamosCache[c.cliente_id] || {}).nro || '').toLowerCase();
  const qDig = q.replace(/\D/g, '');
  return nombre.includes(q) || dni.includes(q) || (nro && nro.includes(q))
    || (qDig.length >= 3 && ((c.telefono||'').includes(qDig) || dni.replace(/\D/g,'').includes(qDig)));
}
function pasaFiltro(c){
  if(filtroActivo === 'sinleer' && !(c.no_leidos > 0)) return false;
  if(filtroActivo === 'sinvincular' && !sinVincularReal(c)) return false;
  return pasaFiltroBase(c);
}

function actualizarContadores(){

function renderChatList(){

  const lista = conversaciones.filter(pasaFiltro);
  const posFijado = id => { const i = chatsFijados.indexOf(id); return i < 0 ? Infinity : i; };
  lista.sort((a, b) => posFijado(a.id) - posFijado(b.id));
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state" style="height:160px;">Sin chats${filtroActivo==='sinleer'?' sin leer':filtroActivo==='sinvincular'?' sin vincular':''}.</div>`;
    return;

  cont.innerHTML = lista.map(c=>{
    const nombre = nombreConversacion(c);
    return `<div class="chat-item ${conversacionActual && conversacionActual.id===c.id?'active':''}" data-id="${escapeHtml(c.id)}">
      <div class="avatar" style="background:${colorParaNombre(nombre)}">${escapeHtml(iniciales(nombre))}</div>
      <div class="chat-info">
        <div class="row1"><span class="nombre">${escapeHtml(nombre)}</span><span class="hora">${chatsFijados.includes(c.id) ? '📌 ' : ''}${horaCorta(c.ultimo_at)}</span></div>
        <div class="row2">

// Cobradores distintos de los clientes con chat, para el filtro "Cobrador".
function actualizarFiltroCobrador(){
  const sel = document.getElementById('filtroCobrador');
  const actual = sel.value;
  const nombres = new Set();
  let haySin = false;
  conversaciones.forEach(c => {
    if(!c.cliente_id || c.es_grupo) return;
    const n = c.clientes && c.clientes.cobrador_nombre;
    if(n) nombres.add(n); else haySin = true;
  });
  const lista = [...nombres].sort((a,b)=>a.localeCompare(b,'es'));
  const html = `<option value="">Todos</option>` + lista.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')
    + (haySin && lista.length ? `<option value="__sin">Sin cobrador</option>` : '');
  if(sel.__html !== html){ sel.innerHTML = html; sel.__html = html; }
  sel.value = (actual && (actual === '__sin' ? haySin : nombres.has(actual))) ? actual : '';
  pintarPillFiltros();
}
function pintarPillFiltros(){
  const selE = document.getElementById('filtroEtapa');
  const selC = document.getElementById('filtroCobrador');
  document.getElementById('txtEtapa').textContent = 'Etapa: ' + (selE.value ? selE.options[selE.selectedIndex].text : 'Todas');
  document.getElementById('txtCobrador').textContent = 'Cobrador: ' + (selC.value ? selC.options[selC.selectedIndex].text : 'Todos');

async function cargarConversaciones(){
  conversaciones = await crmListConversaciones();
  // La lista se reemplaza entera: el chat abierto pasa a apuntar a su
  // versión nueva (si no, quedaba con datos viejos, ej. sin el cliente
  // recién agendado).
  if(conversacionActual){
    const nueva = conversaciones.find(c => c.id === conversacionActual.id);
    if(nueva) conversacionActual = nueva;
  }
  actualizarFiltroCobrador();
  renderChatList();
}

// Se llama seguido (realtime + polling), y con cientos de chats salir a
// buscar de nuevo el resumen de préstamos cada vez es caro y no cambia tan
// seguido — se separa de cargarConversaciones() para no frenar la lista.
async function cargarResumenPrestamos(){
  resumenPrestamosCache = await crmListResumenPrestamos();
  renderChatList();
}

// Token de carga: si el usuario hace clic en otro chat mientras este
// todavía está trayendo datos, la carga vieja se da cuenta (compara su
// propio número contra el actual) y no pisa la pantalla con datos de un
// chat que ya no es el que está abierto.
let cargaActual = 0;

async function abrirConversacion(id){
  const miCarga = ++cargaActual;
  conversacionActual = conversaciones.find(c=>c.id===id);
  if(!conversacionActual) return;
  renderChatList();

  // Se pinta el esqueleto de la conversación al toque, sin esperar a
  // Supabase — así el clic se siente instantáneo.
  mensajesActuales = [];
  eventosActuales = [];
  fichaActual = null;
  renderConversacionShell();
  renderFicha();
  document.getElementById('fichaLateral').classList.add('open');

  const [mensajes, eventos] = await Promise.all([
    crmListMensajes(id),
    conversacionActual.cliente_id ? crmListEventosConversacion(conversacionActual.cliente_id) : Promise.resolve([]),
  ]);
  if (miCarga !== cargaActual) return;

  mensajesActuales = conNoGuardados(id, mensajes);
  eventosActuales = eventos;
  await renderMensajes(true);

  crmMarcarConversacionLeida(id).then(() => {
    if (miCarga !== cargaActual) return;
    conversacionActual.no_leidos = 0;
    renderChatList();
  });

  if (conversacionActual.cliente_id) recargarFicha(miCarga);

  if(canalMensajes) window.sb.removeChannel(canalMensajes);
  let recargaPendiente = null;
  canalMensajes = crmSuscribirMensajes(id, (payload)=>{
    if (miCarga !== cargaActual) return;
    // Cambio de tilde (enviado -> entregado -> leído): llega la fila nueva
    // entera, alcanza con actualizar ese globo sin volver a pedir todo.
    if(payload && payload.eventType === 'UPDATE' && payload.new){
      const m = mensajesActuales.find(x => x.id === payload.new.id);
      if(m){ Object.assign(m, payload.new); renderMensajes(); return; }
    }
    // Mensaje nuevo: se recarga (con una pausita, por si llegan varios juntos).
    clearTimeout(recargaPendiente);
    recargaPendiente = setTimeout(async ()=>{
      const lista = await crmListMensajes(id);
      if (miCarga !== cargaActual) return;
      mensajesActuales = conNoGuardados(id, lista);
      renderMensajes();
    }, 250);
  });
}

async function recargarFicha(miCarga){
  const f = await crmGetFichaCliente(conversacionActual.cliente_id);
  if (miCarga !== undefined && miCarga !== cargaActual) return;
  fichaActual = f;
  renderFicha();
}

/* ===== Adjuntos (bucket privado "comprobantes") ===== */
// El bucket es privado (puede traer datos personales), así que se muestran
// con URLs firmadas de una hora. Se guardan por media_path para no pedir
// una firma nueva cada vez que llega un mensaje y se redibuja el chat; se
// renuevan a los 50 minutos. Si la firma falla (ej. falta el permiso de
// lectura del bucket) se reintenta recién al minuto.
const urlsFirmadas = new Map();
async function firmarAdjuntos(paths){
  const ahora = Date.now();
  const faltan = [...new Set(paths)].filter(p => { const c = urlsFirmadas.get(p); return !c || c.vence <= ahora; });
  if(!faltan.length) return;
  const guardar = (p, url) => urlsFirmadas.set(p, { url: url || null, vence: ahora + (url ? 50 * 60000 : 60000) });
  const bucket = window.sb.storage.from('comprobantes');
  try{
    if(bucket.createSignedUrls){
      const { data, error } = await bucket.createSignedUrls(faltan, 3600);
      if(error) throw error;
      (data || []).forEach(r => guardar(r.path, !r.error && r.signedUrl));
      faltan.forEach(p => { if(!urlsFirmadas.has(p) || urlsFirmadas.get(p).vence <= ahora) guardar(p, null); });
    } else {
      await Promise.all(faltan.map(async p => {
        try{ const { data, error } = await bucket.createSignedUrl(p, 3600); guardar(p, !error && data && data.signedUrl); }
        catch(e){ guardar(p, null); }
      }));
    }
  }catch(e){
    console.error('No se pudieron firmar los adjuntos', e);
    faltan.forEach(p => guardar(p, null));
  }
}
function urlAdjunto(path){ const c = urlsFirmadas.get(path); return c ? c.url : null; }
function extension(path, tipo){
  const m = /\.([a-z0-9]{2,4})$/i.exec(path || '');
  return (m ? m[1] : (tipo === 'pdf' ? 'pdf' : tipo === 'audio' ? 'ogg' : 'jpg')).toLowerCase();
}
// WhatsApp no manda el nombre original de las fotos: se nombran como en el
// render ("comprobante...") con la fecha, para que la descarga sea clara.
function nombreAdjunto(m){
  const d = new Date(m.creado_at);
  const sufijo = isNaN(d) ? '' : `_${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`;
  return (m.tipo === 'audio' ? 'audio' : 'comprobante') + sufijo + '.' + extension(m.media_path, m.tipo);
}
function burbujaAdjunto(m){
  if(m.media_path){
    const url = urlAdjunto(m.media_path);
    const nombre = nombreAdjunto(m);
    if(m.tipo === 'imagen'){
      return `<div class="adj-card"><div class="adj-nombre">📄 ${escapeHtml(nombre)}</div>${url
        ? `<button class="adj-thumb" data-ver="${escapeHtml(m.media_path)}" data-nombre="${escapeHtml(nombre)}" title="Ver en grande"><img class="adj-img" src="${escapeHtml(url)}" alt="${escapeHtml(nombre)}" loading="lazy"></button>`
        : `<div class="adj-nodisp">📷 Imagen no disponible</div>`}</div>`;
    }
    if(m.tipo === 'pdf'){
      return `<div class="adj-card"><div class="adj-nombre">📄 ${escapeHtml(nombre)}${url ? ` · <a href="${escapeHtml(url)}" target="_blank" rel="noopener">Ver PDF</a>` : ''}</div>${url ? '' : `<div class="adj-nodisp">PDF no disponible</div>`}</div>`;
    }
    if(m.tipo === 'audio'){
      return `<div class="adj-card"><div class="adj-nombre">🎙️ Audio</div>${url ? `<audio controls preload="none" src="${escapeHtml(url)}"></audio>` : `<div class="adj-nodisp">Audio no disponible</div>`}</div>`;
    }
    return `<div class="adj-card"><div class="adj-nombre">📎 Adjunto${url ? ` · <a href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir</a>` : ''}</div></div>`;
  }
  if(m.tipo === 'audio') return `<div class="adjunto-nota">🎙️ Audio (del historial, no se descargó)</div>`;
  if(m.tipo === 'imagen') return `<div class="adjunto-nota">📷 Imagen (no se pudo descargar)</div>`;
  if(m.tipo === 'pdf') return `<div class="adjunto-nota">📄 PDF (no se pudo descargar)</div>`;
  return '';
}

// Visor a pantalla completa. "Descargar" pide otra URL firmada con el
// nombre del archivo (el navegador no deja forzar la descarga de un link de
// otro dominio con solo el atributo download).
async function abrirVisor(path, nombre){
  const url = urlAdjunto(path);
  if(!url) return;
  const v = document.createElement('div');
  v.className = 'visor';
  v.innerHTML = `<div class="visor-barra"><span>📄 ${escapeHtml(nombre)}</span><div class="acciones">
      <a id="visorDescargar" href="${escapeHtml(url)}" target="_blank" rel="noopener" download="${escapeHtml(nombre)}">⬇ Descargar</a>
      <button id="visorCerrar">✕ Cerrar</button></div></div>
    <div class="visor-img"><img src="${escapeHtml(url)}" alt="${escapeHtml(nombre)}"></div>`;
  document.body.appendChild(v);
  const cerrar = () => { v.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', onKey);
  v.querySelector('#visorCerrar').addEventListener('click', cerrar);
  v.addEventListener('click', e => { if(e.target === v || e.target.classList.contains('visor-img')) cerrar(); });
  try{
    const { data } = await window.sb.storage.from('comprobantes').createSignedUrl(path, 600, { download: nombre });
    if(data && data.signedUrl) v.querySelector('#visorDescargar').href = data.signedUrl;
  }catch(e){ /* queda el link común: abre la imagen y se guarda desde ahí */ }
}

/* ===== Tildes de WhatsApp ===== */
const SVG_RELOJ = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.4V6l1.7 1.1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
const SVG_TILDE = '<svg width="12" height="11" viewBox="0 0 12 11" aria-hidden="true"><path d="M1.3 5.9 4.3 8.9 10.7 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_DOBLE = '<svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true"><path d="M1.3 5.9 4.3 8.9 10.7 2M8.2 7.9l1 1L15.6 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function tildeHtml(m){
  if(m.direccion !== 'saliente') return '';
  switch(m.estado){
    case 'noguardado': return `<span class="tilde error" title="No llegó a la cola de envío">⚠️ No se envió · <button class="reintentar" data-reintentar="${escapeHtml(m.id)}">Reintentar</button></span>`;
    case 'leido':     return `<span class="tilde leido" title="Leído">${SVG_DOBLE}</span>`;
    case 'entregado': return `<span class="tilde" title="Entregado">${SVG_DOBLE}</span>`;
    case 'enviado':   return `<span class="tilde" title="Enviado">${SVG_TILDE}</span>`;
    case 'error':     return `<span class="tilde error" title="WhatsApp no lo aceptó">⚠️ No se envió · <button class="reintentar" data-reintentar="${escapeHtml(m.id)}">Reintentar</button></span>`;
    default:          return `<span class="tilde" title="En cola de envío">${SVG_RELOJ}</span>`;
  }

/* ===== Avisos de regla automática ===== */
function normalizarTxt(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
// Qué disparó la regla (como en el render: “hoy lo transfiero”, o
// imagen + “transferí”): el evento solo guarda el nombre de la regla, así
// que se busca en el mensaje entrante que lo provocó cuál de las palabras
// clave de esa regla aparece.
function disparadorRegla(ev){
  const d = ev.detalle || {};
  const regla = reglasCache.find(r => r.nombre === d.regla);
  if(!regla) return null;
  const t = new Date(ev.creado_at).getTime();
  let msg = null;
  for(const m of mensajesActuales){
    if(m.direccion !== 'entrante') continue;
    const tm = new Date(m.creado_at).getTime();
    if(tm <= t + 5000 && t - tm < 15 * 60000) msg = m;
  }
  if(!msg) return null;
  const partes = [];
  if(regla.tipo_adjunto && (msg.tipo === 'imagen' || msg.tipo === 'pdf')) partes.push(msg.tipo === 'imagen' ? 'imagen' : 'PDF');
  const txt = normalizarTxt(msg.texto);
  const palabra = (regla.palabras || []).find(p => p && txt.includes(normalizarTxt(p)));
  if(palabra) partes.push(`“${escapeHtml(palabra)}”`);
  return partes.length ? partes.join(' + ') : null;
}
// "🤖 Regla automática: “hoy lo transfiero” → Promesa de pago (30/09) ·
// movido a Promesa de pago" (como en el render 5.1).
function textoEventoRegla(ev){
  const d = ev.detalle || {};
  const a = d.accion || {};
  const disparo = disparadorRegla(ev);
  const partes = [];
  if(d.fecha_detectada) partes.push(`${escapeHtml(d.regla || 'Promesa')} (${escapeHtml(fmtFecha(d.fecha_detectada).slice(0,5))})`);
  if(a.etiqueta) partes.push(`etiqueta ${emojiEtiqueta(a.etiqueta)}${escapeHtml(a.etiqueta)}`);
  if(a.mueve_a){
    const destino = etapasCache.find(e => e.id === a.mueve_a);
    const origen = a.mueve_de ? etapasCache.find(e => e.id === a.mueve_de) : null;
    partes.push(`movido ${origen ? `de <b>${escapeHtml(origen.name)}</b> ` : ''}a <b>${escapeHtml(destino ? destino.name : a.mueve_a)}</b>`);
  }
  if(disparo && !partes.length) partes.push(escapeHtml(d.regla || ''));
  return `🤖 Regla automática: ${disparo || `“${escapeHtml(d.regla || '')}”`}${partes.length ? ' → ' + partes.join(' · ') : ''}`;
}

function etiquetaDia(fecha){
  const d = new Date(fecha);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dia = new Date(d); dia.setHours(0,0,0,0);
  const dif = Math.round((hoy - dia) / 86400000);
  if(dif === 0) return 'Hoy';
  if(dif === 1) return 'Ayer';
  if(dif > 1 && dif < 7){ const s = d.toLocaleDateString('es-AR', { weekday:'long' }); return s[0].toUpperCase() + s.slice(1); }
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

// Redibuja la conversación reutilizando los globos que no cambiaron (por
// clave): así un cambio de tilde o un mensaje nuevo no recarga las fotos
// ni corta un audio que se está escuchando.
let renderToken = 0;
async function renderMensajes(forzarAbajo){
  const miRender = ++renderToken;
  const conAdjunto = mensajesActuales.filter(m => m.media_path).map(m => m.media_path);
  if(conAdjunto.length) await firmarAdjuntos(conAdjunto);
  if(miRender !== renderToken) return;
  const msgs = document.getElementById('convMessages');
  if (!msgs) return;

  // Mezcla mensajes + eventos de regla en una sola línea de tiempo, para
  // que el aviso "Regla automática: ..." aparezca pegado al mensaje que lo
  // disparó, igual que en el render del plan.
  const items = [
    ...mensajesActuales.map(m => ({ tipo: 'mensaje', fecha: m.creado_at, data: m })),
    ...eventosActuales.map(ev => ({ tipo: 'regla', fecha: ev.creado_at, data: ev })),
  ].sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

  if(!items.length){
    msgs.innerHTML = `<div class="empty-state">Todavía no hay mensajes en este chat.</div>`;
    return;
  }
  const estabaAbajo = forzarAbajo || msgs.__abajo !== false;
  const piezas = [];
  let diaAnterior = null;
  items.forEach(it=>{
    const dia = new Date(it.fecha).toDateString();
    if(dia !== diaAnterior){
      diaAnterior = dia;
      piezas.push({ key: 'd' + dia, html: `<div class="dia-divisor"><span>${escapeHtml(etiquetaDia(it.fecha))}</span></div>` });
    }
    if(it.tipo === 'regla'){
      piezas.push({ key: 'r' + (it.data.id || it.data.creado_at), html: `<div class="regla-aviso">${textoEventoRegla(it.data)}</div>` });
      return;
    }
    const m = it.data;
    const autor = m.direccion === 'saliente' ? `<div class="autor">${escapeHtml(nombreUsuarioCache || 'Vos')}</div>`
      : (m.autor ? `<div class="autor" style="color:${colorParaNombre(m.autor)}">${escapeHtml(m.autor)}</div>` : '');
    // Mensajes viejos de grupos guardados vacíos (reacciones, avisos): no se muestran.
    if(m.tipo === 'otro' && !m.texto && !m.media_path) return;
    piezas.push({ key: 'm' + m.id, html: `<div class="bubble ${m.direccion === 'saliente' ? 'saliente' : 'entrante'}">${autor}${burbujaAdjunto(m)}${m.texto ? `<div class="txt">${formatoWA(m.texto)}</div>` : ''}<div class="meta"><span>${horaMensaje(m.creado_at)}</span>${tildeHtml(m)}</div></div>` });
  });

  const viejos = new Map();
  [...msgs.children].forEach(n => { if(n.dataset && n.dataset.key) viejos.set(n.dataset.key, n); });
  const frag = document.createDocumentFragment();
  const tpl = document.createElement('template');
  piezas.forEach(p=>{
    let n = viejos.get(p.key);
    if(!n || n.__html !== p.html){
      tpl.innerHTML = p.html;
      n = tpl.content.firstElementChild;
      n.dataset.key = p.key;
      n.__html = p.html;
    }
    frag.appendChild(n);
  });
  msgs.replaceChildren(frag);
  if(estabaAbajo){ msgs.scrollTop = msgs.scrollHeight; msgs.__abajo = true; }
}

function textoPlantillaConDatos(nombrePlantilla){
  let texto = plantillasCache[nombrePlantilla] || '';
  if(fichaActual){
    const c = fichaActual.cliente;
    const p = fichaActual.prestamoActivo;
    const mora = fichaActual.mora;
    const monto = mora ? (mora.importe_atraso || mora.saldo_total) : p ? (p.saldo_total_punitorios || p.saldo_total) : '';
    texto = texto.replace(/{cliente}/g, c.nombre||'')
      .replace(/{monto}/g, monto ? fmtPesos(monto) : '')
      .replace(/{fecha}/g, c.promesa_fecha ? fmtFecha(c.promesa_fecha) : '')
      .replace(/{ejecutivo}/g, nombreUsuarioCache || '');
  }
  return texto;
}

// Deja el mensaje en la cola (lo manda el worker). Si falla, el globo queda
// con "No se envió · Reintentar" y no se pierde el texto.
async function guardarEnCola(convId, temp){
  try{
    await crmEnviarMensaje(convId, temp.texto);
    const lista = (noGuardados.get(convId) || []).filter(x => x !== temp);
    if(lista.length) noGuardados.set(convId, lista); else noGuardados.delete(convId);
    await cargarConversaciones();
  }catch(e){
    temp.estado = 'noguardado';
    const lista = noGuardados.get(convId) || [];
    if(!lista.includes(temp)) noGuardados.set(convId, [...lista, temp]);
    if(conversacionActual && conversacionActual.id === convId) renderMensajes();
    toast(navigator.onLine === false ? 'Sin internet: el mensaje no se envió. Tocá "Reintentar" cuando vuelva la conexión.'
      : 'El mensaje no se pudo dejar en la cola de envío. Tocá "Reintentar".', 'error');
  }
}

async function reintentarMensaje(id){
  if(!conversacionActual) return;
  const convId = conversacionActual.id;
  const temp = (noGuardados.get(convId) || []).find(x => x.id === id);
  if(temp){
    temp.estado = 'pendiente';
    renderMensajes();
    await guardarEnCola(convId, temp);
    return;
  }
  // Rechazado por WhatsApp (estado 'error'): vuelve a la cola.
  const m = mensajesActuales.find(x => x.id === id);
  if(!m) return;
  const { error } = await window.sb.from('mensajes').update({ estado: 'pendiente' }).eq('id', id).eq('estado', 'error');
  if(error){ toast('No se pudo reintentar el mensaje.', 'error'); return; }
  m.estado = 'pendiente';
  renderMensajes();
}

// ¿El cliente está en el archivo que se subió en Refinanciaciones? (lo
// guarda esa pantalla en este mismo navegador). Se compara por DNI (o el DNI
// dentro del CUIL) y por número de préstamo.
let _refiIdx = null;
function indiceRefi(){
  let raw = null;
  try{ raw = localStorage.getItem('refi_dashboard_rows_v1'); }catch(e){}
  if(_refiIdx && _refiIdx.raw === raw) return _refiIdx;
  _refiIdx = { raw, dnis: new Set(), prestamos: new Set() };
  if(!raw) return _refiIdx;
  try{
    const rows = JSON.parse(raw);
    const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
    const head = (rows[0] || []).map(norm);
    const iDni = ['dni cuil','dni','cuil'].map(h => head.indexOf(h)).find(i => i >= 0);
    const iPre = head.indexOf('prestamo');
    rows.slice(1).forEach(r => {
      const d = String(iDni !== undefined ? r[iDni] : '').replace(/\D/g,'');
      if(d.length === 11) _refiIdx.dnis.add(String(Number(d.slice(2,10))));
      else if(d) _refiIdx.dnis.add(String(Number(d)));
      const n = String(iPre >= 0 ? r[iPre] : '').replace(/\D/g,'');
      if(n) _refiIdx.prestamos.add(String(Number(n)));
    });
  }catch(e){ console.warn('archivo de refinanciaciones', e); }
  return _refiIdx;
}
function enArchivoRefi(cliente, p){
  const idx = indiceRefi();
  const dni = String(cliente.dni || '').replace(/\D/g,'');
  const nro = String((p && p.nro) || '').replace(/\D/g,'');
  return (dni && idx.dnis.has(String(Number(dni)))) || (nro && idx.prestamos.has(String(Number(nro))));
}

/* ===== Modales ===== */
function abrirModal(html, ancho){
  const fondo = document.createElement('div');
  fondo.className = 'modal-fondo';
  fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${ancho ? `style="width:${ancho}px"` : ''}>${html}</div>`;
  document.body.appendChild(fondo);
  const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', onKey);
  fondo.addEventListener('mousedown', e => { if(e.target === fondo) cerrar(); });
  fondo.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', cerrar));
  return { el: fondo, cerrar };
}

    }
  });
}

// "👤 Agendar": crea el cliente o vincula el chat a uno que ya existe. Al
// guardar, se recarga la lista y se reabre el chat ya con su ficha.
function abrirModalAgendar(){
  const conv = conversacionActual;
  if(!conv || conv.es_grupo) return;
  // Chat ya agendado: el mismo cuadro sirve para corregir nombre / DNI o
  // pasarlo a otro cliente.
  const editar = !!conv.cliente_id;
  const cli = conv.clientes || {};
  const tel = conv.telefono ? telefonoLindo(conv.telefono) : 'Número todavía no disponible';
  // El nombre con el que se agendó en WhatsApp (si lo mandó) sirve de punto
  // de partida para el nombre del cliente.
  const nombreWa = conv.nombre && !/^[+\d\s()-]+$/.test(conv.nombre) ? String(conv.nombre).replace(/^~\s*/, '') : '';
  const m = abrirModal(`
    <div class="modal-head"><div><h2>${editar ? '✏️ Editar contacto' : '👤 Agendar contacto'}</h2><div class="sub">📱 ${escapeHtml(tel)}</div></div><button class="modal-x" data-cerrar>✕</button></div>
    <div class="modal-body">
      <div class="seg"><button class="active" data-tab="nuevo">${editar ? 'Cambiar nombre y DNI' : 'Crear cliente nuevo'}</button><button data-tab="existente">${editar ? 'Vincular a otro cliente' : 'Vincular a cliente existente'}</button></div>
      <div data-panel="nuevo">
        <label class="m-label" for="agNombre">Nombre y apellido *</label>
        <input class="m-input" id="agNombre" placeholder="Ej: María González" value="${escapeHtml(editar ? (cli.nombre || '') : nombreWa)}">
        <label class="m-label" for="agDni">DNI (opcional)</label>
        <input class="m-input" id="agDni" inputmode="numeric" placeholder="Ej: 32145678" value="${escapeHtml(editar ? (cli.dni || '') : '')}">
        <div class="m-ayuda" ${editar ? 'style="display:none"' : ''}>Se crea en la etapa “A contactar” del Kanban${conv.telefono ? ' con este número como teléfono' : ''}.</div>
      </div>
      <div data-panel="existente" style="display:none;">
        <label class="m-label" for="agBuscar">Buscar por nombre o DNI</label>
        <input class="m-input" id="agBuscar" placeholder="Escribí al menos 2 letras o 4 números..." autocomplete="off">
        <div class="resultados" id="agResultados"></div>
        <div class="m-ayuda" id="agEstado"></div>
      </div>
    </div>
    <div class="modal-pie"><span class="error" id="agError"></span><button class="btn" data-cerrar>Cancelar</button><button class="btn btn-verde" id="agGuardar">${editar ? 'Guardar cambios' : 'Crear y agendar'}</button></div>`, 460);
  const el = m.el;
  let pestana = 'nuevo';
  let elegido = null;
  const btnGuardar = el.querySelector('#agGuardar');
  const error = el.querySelector('#agError');
  const actualizarBoton = () => {
    btnGuardar.textContent = pestana === 'nuevo' ? (editar ? 'Guardar cambios' : 'Crear y agendar') : 'Vincular';
    btnGuardar.disabled = pestana === 'existente' && !elegido;
  };
  el.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', ()=>{
    pestana = b.dataset.tab;
    el.querySelectorAll('.seg button').forEach(x => x.classList.toggle('active', x === b));
    el.querySelectorAll('[data-panel]').forEach(p => p.style.display = p.dataset.panel === pestana ? '' : 'none');
    error.textContent = '';
    actualizarBoton();
    el.querySelector(pestana === 'nuevo' ? '#agNombre' : '#agBuscar').focus();
  }));
  el.querySelector('#agNombre').focus();

  const inputBuscar = el.querySelector('#agBuscar');
  const cont = el.querySelector('#agResultados');
  const estado = el.querySelector('#agEstado');
  let tBuscar = null, nBusqueda = 0;
  inputBuscar.addEventListener('input', ()=>{
    clearTimeout(tBuscar);
    const q = inputBuscar.value.trim();
    elegido = null; actualizarBoton();
    if(q.replace(/\D/g,'').length < 4 && q.length < 2){ cont.innerHTML = ''; estado.textContent = ''; return; }
    estado.textContent = 'Buscando...';
    tBuscar = setTimeout(async ()=>{
      const miBusqueda = ++nBusqueda;
      const lista = await crmBuscarClientes(q);
      if(miBusqueda !== nBusqueda) return;
      estado.textContent = lista.length ? (lista.length === 20 ? 'Se muestran los primeros 20: afiná la búsqueda si no está.' : '') : 'No se encontró ningún cliente con eso. Probá con otra parte del nombre o creá uno nuevo.';
      cont.innerHTML = lista.map(c => `<div class="resultado" data-id="${escapeHtml(c.id)}" data-nombre="${escapeHtml(c.nombre)}">
          <div class="avatar" style="background:${colorParaNombre(c.nombre)}">${escapeHtml(iniciales(c.nombre))}</div>
          <div style="min-width:0;"><div class="n">${escapeHtml(c.nombre)}</div><div class="d">${c.dni ? 'DNI ' + escapeHtml(fmtDni(c.dni)) : 'Sin DNI'}${c.telefono_principal ? ' · ' + escapeHtml(telefonoLindo(c.telefono_principal)) : ''}</div></div>
        </div>`).join('');
    }, 300);
  });
  cont.addEventListener('click', e=>{
    const r = e.target.closest('.resultado');
    if(!r) return;
    cont.querySelectorAll('.resultado').forEach(x => x.classList.toggle('sel', x === r));
    elegido = { id: r.dataset.id, nombre: r.dataset.nombre };
    error.textContent = '';
    actualizarBoton();
  });
  cont.addEventListener('dblclick', e=>{ if(e.target.closest('.resultado')) btnGuardar.click(); });
  el.querySelectorAll('#agNombre, #agDni').forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter') btnGuardar.click(); }));

  btnGuardar.addEventListener('click', async ()=>{
    error.textContent = '';
    let opciones, nombreFinal;
    if(pestana === 'nuevo'){
      const nombre = el.querySelector('#agNombre').value.trim();
      const dni = el.querySelector('#agDni').value.replace(/\D/g,'');
      if(!nombre){ error.textContent = 'Poné el nombre del cliente.'; el.querySelector('#agNombre').focus(); return; }
      if(dni && (dni.length < 7 || dni.length > 8)){ error.textContent = 'El DNI tiene que tener 7 u 8 números.'; return; }
      opciones = { conversacionId: conv.id, nuevo: { nombre, dni } };
      nombreFinal = nombre;
    } else {
      if(!elegido){ error.textContent = 'Elegí un cliente de la lista.'; return; }
      opciones = { conversacionId: conv.id, clienteId: elegido.id };
      nombreFinal = elegido.nombre;
    }
    btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando...';
    try{
      if(editar && pestana === 'nuevo'){
        const { error: eUpd } = await window.sb.from('clientes').update({ nombre: nombreFinal, dni: opciones.nuevo.dni || null }).eq('id', conv.cliente_id);
        if(eUpd) throw eUpd;
      } else await crmAgendarConversacion(opciones);
      m.cerrar();
      toast(editar ? `✅ Contacto actualizado: ${nombreFinal}` : `✅ Contacto agendado como ${nombreFinal}`);
      await cargarConversaciones();
      cargarResumenPrestamos();
      abrirConversacion(conv.id);
    }catch(err){
      console.error(err);
      btnGuardar.disabled = false; actualizarBoton();
      error.textContent = 'No se pudo agendar: ' + (err && err.message ? err.message : 'probá de nuevo.');
    }
  });
}

// "123.456,50" / "$ 86400" / "86.400" -> número.
function parseMonto(txt){
  let s = String(txt||'').replace(/[^\d.,-]/g, '');
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/\.\d{3}(\.|$)/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s) || 0;
}

// "✅ Confirmar pago": imputa el pago a las cuotas (crmConfirmarPago), lo
// suma en Sueldo & Cobros y pasa al cliente a "Cerrado (Cobrado)".
// soloMoverEtapa: viene de elegir "Cerrado" en el select de etapa; deja
// la opción de mover sin registrar pago (ej. lo registró otra persona).
function abrirModalPago(soloMoverEtapa){
  if(!fichaActual) return;
  const { cliente, prestamoActivo: p, mora } = fichaActual;
  const conv = conversacionActual;
  const miCarga = cargaActual;
  const saldoVencido = mora ? mora.importe_atraso : (p ? p.importe_atraso || 0 : 0);
  const valorCuota = (p && p.cuota_monto) || (mora && mora.cuotas && mora.cuotas[0] && mora.cuotas[0].monto) || 0;
  const saldoTotal = mora ? mora.saldo_total : (p ? p.saldo_total : null);
  const sugerido = saldoVencido > 0 ? saldoVencido : valorCuota;
  const fmtNum = n => Math.round(Number(n)||0).toLocaleString('es-AR');
  const m = abrirModal(`
    <div class="modal-head"><div><h2>✅ Confirmar pago</h2><div class="sub">${escapeHtml(cliente.nombre)}${p && p.nro ? ' · Préstamo Nº ' + escapeHtml(p.nro) : ''}</div></div><button class="modal-x" data-cerrar>✕</button></div>
    <div class="modal-body">
      <label class="m-label" for="pagoMonto">Monto que pagó</label>
      <div class="monto-caja"><span class="peso">$</span><input class="m-input" id="pagoMonto" inputmode="decimal" value="${sugerido ? fmtNum(sugerido) : ''}" placeholder="0"></div>
      <div class="m-ayuda" style="margin-top:-6px;">${saldoVencido > 0 ? `Saldo vencido: <b>${fmtPesos(saldoVencido)}</b>` : 'Sin saldo vencido'}${valorCuota ? ` · Cuota: ${fmtPesos(valorCuota)}` : ''}${saldoTotal ? ` · Saldo total: ${fmtPesos(saldoTotal)}` : ''}</div>
      <div class="opciones-pago">
        <label class="opcion"><input type="radio" name="pagoTipo" value="cuotas" checked><div><b>Pagó cuota(s)</b><span>Se imputa a las cuotas impagas más viejas.</span></div></label>
        <label class="opcion"><input type="radio" name="pagoTipo" value="total"><div><b>Canceló el préstamo completo</b><span>Se saldan todas las cuotas y queda con la etiqueta “Cancelado”.</span></div></label>
      </div>
      <div class="m-ayuda">El pago se suma en Registro de pagos y el cliente pasa a “Cerrado (Cobrado)”.</div>
    </div>
    <div class="modal-pie"><span class="error" id="pagoError"></span>
      ${soloMoverEtapa ? `<button class="btn" id="pagoSoloMover" title="Mover a Cerrado sin registrar un pago">Solo mover</button>` : `<button class="btn" data-cerrar>Cancelar</button>`}
      <button class="btn btn-verde" id="pagoConfirmar">Confirmar</button></div>`, 440);
  const el = m.el;
  const input = el.querySelector('#pagoMonto');
  input.focus(); input.select();
  let editado = false;
  input.addEventListener('input', ()=>{ editado = true; });
  el.querySelectorAll('input[name=pagoTipo]').forEach(r => r.addEventListener('change', ()=>{
    if(editado) return;
    input.value = r.value === 'total' && saldoTotal ? fmtNum(saldoTotal) : (sugerido ? fmtNum(sugerido) : '');
  }));
  input.addEventListener('keydown', e => { if(e.key === 'Enter') el.querySelector('#pagoConfirmar').click(); });

  const refrescar = async () => {
    await Promise.all([cargarConversaciones(), cargarResumenPrestamos()]);
    if(conversacionActual && conv && conversacionActual.id === conv.id && miCarga === cargaActual) await recargarFicha(miCarga);
  };
  const btnSolo = el.querySelector('#pagoSoloMover');
  if(btnSolo) btnSolo.addEventListener('click', async ()=>{
    const etapaCerrado = etapasCache.find(e => e.id === 'cerrado');
    btnSolo.disabled = true;
    try{
      await crmMoverEtapa(cliente.id, etapaCerrado._rowId);
      m.cerrar();
      toast('Cliente movido a Cerrado (Cobrado), sin registrar pago.');
      await refrescar();
    }catch(e){ btnSolo.disabled = false; el.querySelector('#pagoError').textContent = 'No se pudo mover de etapa.'; }
  });
  // Si se cierra sin confirmar (venía del select de etapa), el select vuelve a como estaba.
  const obs = new MutationObserver(()=>{ if(!document.body.contains(el)){ obs.disconnect(); if(soloMoverEtapa && miCarga === cargaActual) renderFicha(); } });
  obs.observe(document.body, { childList: true });

  el.querySelector('#pagoConfirmar').addEventListener('click', async (e)=>{
    const cancelaTotal = el.querySelector('input[name=pagoTipo]:checked').value === 'total';
    const monto = parseMonto(input.value);
    const error = el.querySelector('#pagoError');
    if(!cancelaTotal && !(monto > 0)){ error.textContent = 'Poné el monto que pagó.'; input.focus(); return; }
    e.target.disabled = true; e.target.textContent = 'Confirmando...';
    try{
      const r = await crmConfirmarPago({ clienteId: cliente.id, monto, cancelaTotal, origen: 'whatsapp' });
      m.cerrar();
      const cant = (p && p.cant_cuotas) || (r.mora && r.mora.cuotas && r.mora.cuotas.length) || 0;
      if(r.cancelado) toast(`✅ Préstamo cancelado${monto ? ' · pago de ' + fmtPesos(monto) : ''} · cliente movido a Cerrado (Cobrado)`);
      else if(r.mora) toast(`✅ Pago de ${fmtPesos(monto)} registrado · Cuotas: ${fmtDecimal(Math.min(r.mora.cuotas_pagas_decimal, cant || Infinity))}${cant ? ' de ' + cant : ''} · Saldo vencido: ${fmtPesos(r.mora.importe_atraso)}`);
      else toast(`✅ Pago de ${fmtPesos(monto)} registrado · cliente movido a Cerrado (Cobrado)`);
      await refrescar();
    }catch(err){
      console.error(err);
      e.target.disabled = false; e.target.textContent = 'Confirmar';
      error.textContent = 'No se pudo confirmar el pago: ' + (err && err.message ? err.message : 'probá de nuevo.');
    }
  });
}

function renderFicha(){
  const el = document.getElementById('fichaLateral');
  const conv = conversacionActual;
  if(!conv){ el.innerHTML = ''; return; }
  if(conv.es_grupo){
    el.innerHTML = `<div class="empty-state" style="height:200px;">Este es un chat grupal — no tiene ficha de cliente.</div>`;
    return;
  }
  const contacto = contactoDe(conv);
  if(contacto){
    el.innerHTML = `<div class="card">
      <div class="card-head"><span class="card-titulo">📇 ${escapeHtml(contacto.nombre)}</span></div>

      ${contacto.cargo ? `<div class="fila"><span class="k">Cargo</span><span class="v">${escapeHtml(contacto.cargo)}</span></div>` : ''}

    el.querySelector('#fichaAgenda').addEventListener('click', abrirModalAgenda);
    return;
  }
  if(!conv.cliente_id){
    el.innerHTML = `<div class="card">
      <div class="card-head"><span class="card-titulo">Contacto sin agendar</span></div>
      <div class="sin-agendar-tel">${conv.telefono ? '📱 ' + escapeHtml(telefonoLindo(conv.telefono)) : '📱 Número no disponible'}</div>
      ${conv.nombre && !conv.telefono ? `<div class="fila"><span class="k">Nombre en WhatsApp</span><span class="v">${escapeHtml(String(conv.nombre).replace(/^~\s*/, ''))}</span></div>` : ''}
      <div class="sin-agendar-txt">Este chat no está vinculado a ningún cliente de tu cartera. Agendalo para ver su préstamo, moverlo en el Kanban y que las reglas automáticas lo sigan.${conv.telefono ? '' : '<br><br>WhatsApp todavía no informó el número de este contacto: igual lo podés vincular a mano.'}</div>

    </div>`;
    el.querySelector('#fichaAgendar').addEventListener('click', abrirModalAgendar);
    const fa = el.querySelector('#fichaAgenda');
    if(fa) fa.addEventListener('click', abrirModalAgenda);
    return;
  }

    return;

  const totalCreditos = (prestamos || []).length;
  // Con plan de cuotas (mora), todo sale calculado al día de hoy; si no,
  // se usan los campos del préstamo, acotados (hay datos viejos del Excel
  // con "339 de 5" cuotas pagas).

  const valorCuota = p ? (p.cuota_monto || (mora && mora.cuotas && mora.cuotas[0] && mora.cuotas[0].monto) || 0) : 0;
  const venc = mora ? mora.proximo_vencimiento : (p && p.proximo_vencimiento);

  const etapaSel = etapaPorRowId(cliente.etapa_id);
  const promesa = cliente.promesa_fecha;
  const dPromesa = diasHasta(promesa);
  const promesaRel = promesa ? (dPromesa === 0 ? 'Hoy' : dPromesa === 1 ? 'Mañana' : dPromesa === -1 ? 'Ayer' : diaSemanaCorto(promesa).split(' ')[0]) : '';
  el.innerHTML = `

      ${cliente.categoria ? `<div class="fila"><span class="k">Categoría</span><span class="tag verde">${escapeHtml(cliente.categoria)}</span></div>` : ''}
    </div>
    ${p ? `
    <div class="card">
      <div class="card-head"><span class="card-titulo">${prestamoCancelado ? 'Préstamo' : 'Préstamo activo'}</span>${prestamoCancelado ? `<span class="tag verde">✅ Cancelado</span>` : (p.nro ? `<span class="card-titulo">Nº ${escapeHtml(p.nro)}</span>` : '')}</div>
      <div class="saldo-label">Saldo vencido</div>
      <div class="saldo-grande ${saldoVencido > 0 ? '' : 'cero'}">${fmtPesos(saldoVencido)}</div>
      ${p.monto ? `<div class="fila"><span class="k">Monto otorgado</span><span class="v">${fmtPesos(p.monto)}</span></div>` : ''}
      ${cant ? `<div class="fila"><span class="k">Cuotas</span><span class="v">${fmtDecimal(pagasAcotadas)} de ${cant}${valorCuota ? ' · ' + fmtPesos(valorCuota) + ' c/u' : ''}</span></div>` : ''}
      <div class="fila"><span class="k">Vencimiento</span><span class="v ${dias > 0 ? 'rojo' : ''}">${prestamoCancelado ? 'Pagado' : fmtFecha(venc)}${dias > 0 ? ` · ${dias} día${dias === 1 ? '' : 's'}` : ''}</span></div>
      ${cant || mora ? `
      <div class="progreso-bar"><div class="fill" style="width:${progresoPct}%;"></div></div>
      <div class="progreso-txt">${progresoPct}% del préstamo cancelado</div>` : ''}
    </div>` : ''}
    <div class="card">
      <div class="card-head"><span class="card-titulo">Gestión</span></div>
      <div class="campo-label primero">Etapa en el Kanban</div>
      <select class="campo-caja" id="fichaEtapa">${etapaSel ? '' : '<option value="" selected>— Sin etapa —</option>'}${etapasCache.map(e=>`<option value="${escapeHtml(e._rowId)}" ${cliente.etapa_id===e._rowId?'selected':''}>${(ESTILO_ETAPA[e.id]||{emoji:'⚫'}).emoji} ${escapeHtml(e.name)}</option>`).join('')}</select>
      <div class="campo-label">Promesa de pago</div>
      <label class="campo-caja" id="cajaPromesa"><span class="fecha-txt ${promesa ? '' : 'vacia'}">📅 ${promesa ? `${fmtFecha(promesa)} · ${promesaRel}` : 'Sin promesa'}</span><span class="lapiz">✏️</span><input type="date" id="fichaPromesa" value="${escapeHtml(promesa||'')}"></label>
      <div class="guardado-ok" id="fichaGuardadoOk"></div>
      ${enArchivoRefi(cliente, p) ? `<button class="btn-refi-apto" id="fichaRefiApto" title="Está en el archivo de Refinanciaciones: ver planes y mensaje">🔁 Apto para refinanciación · ver planes</button>` : ''}
    </div>
    <div class="ficha-acciones">
      <button class="primary" id="fichaConfirmarPago">✅ Confirmar pago</button>
      <button id="fichaRefinanciar">🔁 Refinanciar</button>
      <button id="fichaProxCredito">🧮 Próx. crédito</button>
      <button id="fichaNota">📝 Agregar nota</button>
    </div>`;

  // Etapa y promesa se guardan solas al cambiarlas (como en el render, que
  // no tiene botón "Guardar").
  const avisarGuardado = (txt) => {
    const ok = document.getElementById('fichaGuardadoOk');
    if(ok){ ok.textContent = txt; setTimeout(()=>{ if(ok) ok.textContent = ''; }, 2500); }
  };
  const reflejarEnLista = (cambios) => {
    Object.assign(cliente, cambios);
    if(conversacionActual.clientes) Object.assign(conversacionActual.clientes, cambios);
    renderChatList();
  };
  document.getElementById('fichaEtapa').addEventListener('change', async (e)=>{
    const etapaId = e.target.value;
    if(!etapaId) return;
    const etapa = etapaPorRowId(etapaId);
    // Pasar a "Cerrado (Cobrado)" es confirmar un pago: se abre el mismo
    // cuadro (con la opción de solo mover, si el pago ya se registró).
    if(etapa && etapa.id === 'cerrado'){ abrirModalPago(true); return; }
    try{
      await crmMoverEtapa(cliente.id, etapaId);
      reflejarEnLista({ etapa_id: etapaId });
      avisarGuardado('✓ Etapa guardada');
    }catch(err){ toast('No se pudo guardar la etapa.', 'error'); renderFicha(); }
  });
  const inputPromesa = document.getElementById('fichaPromesa');
  document.getElementById('cajaPromesa').addEventListener('click', (e)=>{
    if(e.target !== inputPromesa) e.preventDefault();
    try{ inputPromesa.showPicker(); }
    catch(err){ document.getElementById('cajaPromesa').classList.add('nativo'); inputPromesa.focus(); }
  });
  inputPromesa.addEventListener('change', async (e)=>{
    const fecha = e.target.value || null;
    try{
      await crmGuardarPromesa(cliente.id, fecha);
      reflejarEnLista({ promesa_fecha: fecha });
      renderFicha();
      avisarGuardado(fecha ? '✓ Promesa guardada' : '✓ Promesa borrada');
    }catch(err){ toast('No se pudo guardar la promesa.', 'error'); }
  });
  document.getElementById('fichaVerCompleta').addEventListener('click', ()=>{
    window.top.postMessage({type:'cm-ir-a-clientes', id: cliente.id}, '*');
  });
  document.getElementById('fichaConfirmarPago').addEventListener('click', ()=> abrirModalPago(false));
  document.getElementById('fichaRefinanciar').addEventListener('click', async ()=>{
    const etapaRef = etapasCache.find(e => e.id === 'refinanciado');
    if(!etapaRef){ toast('No se encontró la etapa "Refinanciado" en tu Kanban.', 'error'); return; }
    try{
      await crmMoverEtapa(cliente.id, etapaRef._rowId);
      reflejarEnLista({ etapa_id: etapaRef._rowId });
      renderFicha();
      irAVista('view-refi');
    }catch(err){ toast('No se pudo mover a Refinanciado.', 'error'); }
  });
  const btnApto = document.getElementById('fichaRefiApto');
  if(btnApto) btnApto.addEventListener('click', ()=>{
    // Refinanciaciones lee este pedido y abre la ficha de este cliente.
    try{ localStorage.setItem('refi_abrir', JSON.stringify({ dni: cliente.dni || '', prestamo: (p && p.nro) || '', t: Date.now() })); }catch(e){}
    irAVista('view-refi');
  });
  document.getElementById('fichaProxCredito').addEventListener('click', ()=> irAVista('view-calc'));
  document.getElementById('fichaNota').addEventListener('click', agregarNotaInterna);
}

document.querySelectorAll('.wa-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.wa-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filtroActivo = btn.dataset.filtro;
    renderChatList();
  });
});
document.getElementById('buscarChat').addEventListener('input', renderChatList);
['filtroEtapa','filtroCobrador'].forEach(id => document.getElementById(id).addEventListener('change', ()=>{ pintarPillFiltros(); renderChatList(); }));
document.getElementById('btnPlantillas').addEventListener('click', ()=> irAVista('view-mensajes'));
document.getElementById('btnNuevoChat').addEventListener('click', ()=>{
  const m = abrirModal(`
    <div class="modal-head"><div><h2>+ Nuevo chat</h2><div class="sub">Arrancá una conversación con un número que todavía no escribió.</div></div><button class="modal-x" data-cerrar>✕</button></div>
    <div class="modal-body"><label class="m-label" for="ncTel">Número de WhatsApp (con código de área)</label><input class="m-input" id="ncTel" inputmode="tel" placeholder="Ej: 11 4532-7781"></div>
    <div class="modal-pie"><span class="error" id="ncError"></span><button class="btn" data-cerrar>Cancelar</button><button class="btn btn-verde" id="ncCrear">Abrir chat</button></div>`, 400);
  const input = m.el.querySelector('#ncTel');
  input.focus();
  input.addEventListener('keydown', e => { if(e.key === 'Enter') m.el.querySelector('#ncCrear').click(); });
  m.el.querySelector('#ncCrear').addEventListener('click', async ()=>{
    if(!input.value.trim()) return;
    try{
      const conv = await crmCrearConversacion(input.value);
      m.cerrar();
      await cargarConversaciones();
      abrirConversacion(conv.id);
    }catch(e){
      m.el.querySelector('#ncError').textContent = 'Teléfono inválido: revisá el código de área.';
    }
  });
});

/* ===== Tema (lo manda el panel principal) ===== */
function applyTheme(theme){ document.documentElement.setAttribute('data-theme', theme==='dark'?'dark':'light'); }
window.addEventListener('message', async e=>{
  if(e.data && e.data.type==='cm-theme') applyTheme(e.data.theme);
  if(e.data && e.data.type==='cm-abrir-chat-cliente' && e.data.clienteId){
    await abrirChatDeCliente(e.data.clienteId);
  }
  if(e.data && e.data.type==='cm-agenda-cambio'){
    await cargarContactos().catch(() => {});
    renderChatList();
  }
  if(e.data && e.data.type==='cm-abrir-chat-telefono' && e.data.telefono){
    try{
      await cargarContactos();
      const conv = await crmCrearConversacion(e.data.telefono);
      await cargarConversaciones();
      abrirConversacion(conv.id);
    }catch(err){ toast('No se pudo abrir el chat de ese número.', 'error'); }
  }
});

// Viene del botón "Abrir chat" de la ficha de Clientes. Si ese cliente ya
// tiene una conversación, la abre; si no tiene ninguna todavía pero tiene
// un teléfono cargado, arranca una nueva (igual que "+ Nuevo chat").
async function abrirChatDeCliente(clienteId){
  if(!conversaciones.length) await cargarConversaciones();
  let conv = conversaciones.find(c => c.cliente_id === clienteId);
  if(!conv){
    const { data: tel } = await window.sb.from('clientes_telefonos').select('telefono').eq('cliente_id', clienteId).eq('principal', true).maybeSingle();
    if(!tel){ toast('Este cliente no tiene teléfono cargado todavía.', 'error'); return; }
    conv = await crmCrearConversacion(tel.telefono);
    await cargarConversaciones();
  }
  abrirConversacion(conv.id);
}

/* ===== Auth + carga inicial ===== */
sb.auth.getSession().then(async ({ data: { session } }) => {
  if (!session) { location.href = 'index.html'; return; }
  await crmBootstrap();
  window._markAppReady();
});
sb.auth.onAuthStateChange((_event, session) => { if (!session) location.href = 'index.html'; });

window.appReady.then(async ()=>{
  const { data: { session } } = await window.sb.auth.getSession();
  etapasCache = await crmListEtapas();
  const selEtapa = document.getElementById('filtroEtapa');
  selEtapa.innerHTML = `<option value="">Todas</option>` + etapasCache.map(e => `<option value="${escapeHtml(e._rowId)}">${escapeHtml(e.name)}</option>`).join('');
  const [plantillas, nombre, reglas] = await Promise.all([
    crmListPlantillas(),
    crmGetNombreUsuario(),
    window.crmListReglas ? crmListReglas().catch(() => []) : Promise.resolve([]),
  ]);
  plantillasCache = plantillas;
  nombreUsuarioCache = nombreCorto(nombre);
  reglasCache = reglas || [];
  await cargarContactos().catch(e => console.warn('contactos', e));
  await cargarConversaciones();
  cargarResumenPrestamos();

  // Con cientos de chats la tabla conversaciones puede recibir una ráfaga
  // de updates en pocos segundos — sin este debounce, cada uno disparaba
  // una recarga completa de la lista.
  let pendienteRecarga = null;
  crmSuscribirConversaciones(session.user.id, () => {
    clearTimeout(pendienteRecarga);
    pendienteRecarga = setTimeout(cargarConversaciones, 1200);
  });
  setInterval(cargarResumenPrestamos, 60000);
  setInterval(() => cargarContactos().then(renderChatList).catch(() => {}), 60000);
});
</script>
